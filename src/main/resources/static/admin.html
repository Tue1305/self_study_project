<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jenny's Nail Studio</title>
    <!-- Favicon Tag -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?=v2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Header Navigation -->
<header class="navbar navbar-expand bg-white shadow-sm px-4">
    <div class="container-fluid">
            <span class="navbar-brand fw-bold text-dark fs-5">
                <i class="bi bi-shield-lock-fill text-pink me-2"></i>Admin Portal
            </span>
        <a href="/" class="navbar-brand fw-bold text-pink text-decoration-none">
            Jenny's Nail Studio
        </a>
        <button class="btn btn-outline-pink btn-sm fw-semibold ms-auto" onclick="handleLogout()">
            <i class="bi bi-box-arrow-right me-1"></i> Log Out
        </button>
    </div>
</header>

<!-- Main Container -->
<main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 fw-bold text-dark mb-0">
            <i class="bi bi-people-fill text-pink me-2"></i>Registered Users & Subscriptions
        </h2>
    </div>

    <!-- Users Table Card -->
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th scope="col" class="py-3 px-4">User ID</th>
                    <scope="col" class="py-3 px-4">Username</th>
                    <th scope="col" class="py-3 px-4">Subscription Tier</th>
                    <th scope="col" class="py-3 px-4">Status</th>
                </tr>
                </thead>
                <tbody id="userTableBody">
                <!-- User rows injected dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Admin Management Panel</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) {
        window.location.href = '/login.html';
    } else {
        loadUsers();
    }

    async function loadUsers() {
        try {
            const response = await fetch('/api/auth/admin/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const users = await response.json();
                const tableBody = document.getElementById('userTableBody');
                tableBody.innerHTML = '';

                users.forEach(user => {
                    // Check if subscription info is saved locally or in DB
                    const savedPlan = localStorage.getItem('selectedPlan') || 'None';
                    const isActive = savedPlan !== 'None';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                            <td class="px-4 fw-semibold text-secondary">${user.id || 'N/A'}</td>
                            <td class="px-4 fw-bold text-dark">${user.username}</td>
                            <td class="px-4"><span class="badge bg-secondary-subtle text-secondary border px-2 py-1">${savedPlan}</span></td>
                            <td class="px-4">
                                <span class="badge ${isActive ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'} px-3 py-2 rounded-pill">
                                    <i class="bi ${isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill'} me-1"></i>
                                    ${isActive ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                        `;
                    tableBody.appendChild(row);
                });
            } else {
                alert('Failed to fetch users or unauthorized.');
            }
        } catch (err) {
            console.error(err);
        }
    }

    function handleLogout() {
        localStorage.removeItem('accessToken');
        window.location.href = '/index.html';
    }
</script>
</body>
</html>
