<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment - Jenny's Nail Studio</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }
        .user-badge-link {
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .user-badge-link:hover {
            transform: translateY(-1px);
            background-color: #f8d7da !important;
            box-shadow: 0 2px 5px rgba(233, 30, 99, 0.15);
        }
        .teaser-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .teaser-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12) !important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navigation Header -->
<header class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 px-lg-4">
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-3">
            <a href="index.html" class="navbar-brand fw-bold text-pink fs-4 mb-0">Jenny's Nail Studio</a>
            <a href="profile.html"
               id="userBadge"
               class="badge bg-danger-subtle text-pink border border-danger-subtle rounded-pill px-3 py-2 fs-6 d-none align-items-center gap-1 user-badge-link"
               title="Click to view and edit profile settings">
                <i class="bi bi-person-fill"></i>
                <span id="usernameDisplay">Client</span>
            </a>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 pt-3 pt-lg-0" id="authNav">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>
</header>

<main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 teaser-card">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center text-pink mb-2 fw-bold">Book Your Appointment</h2>
                    <p class="text-center text-muted mb-4" id="selectedDesignBanner">Secure your time slot online!</p>

                    <div id="successMessage" class="alert alert-success d-none text-center" role="alert">
                        🎉 Appointment booked successfully! We look forward to seeing you.
                    </div>

                    <form id="bookingForm">
                        <div class="mb-3">
                            <label for="customerName" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="customerName" required placeholder="Jane Doe">
                        </div>

                        <div class="mb-3">
                            <label for="customerPhone" class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" id="customerPhone" required placeholder="(555) 000-0000">
                        </div>

                        <div class="mb-3">
                            <label for="customerEmail" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="customerEmail" required placeholder="jane@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="serviceSelect" class="form-label fw-semibold">Select Nail Service / Design</label>
                            <select class="form-select" id="serviceSelect" required>
                                <option value="">Loading services...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="nailTechSelect" class="form-label fw-semibold">Preferred Nail Technician</label>
                            <select class="form-select" id="nailTechSelect" required>
                                <option value="">Loading technicians...</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="appointmentTime" class="form-label fw-semibold">Date & Time</label>
                            <input type="datetime-local" class="form-control" id="appointmentTime" required>
                        </div>

                        <button type="submit" class="btn btn-pink w-100 btn-lg rounded-3 fw-bold">Confirm Booking Submission</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Custom Nail Sculpting & Artistry</small>
    </div>
</footer>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            const payload = JSON.parse(jsonPayload);
            if (payload.exp && Date.now() >= payload.exp * 1000) return null;
            return payload;
        } catch (e) {
            return null;
        }
    }

    const token = localStorage.getItem('accessToken') || localStorage.getItem('token');

    // Fetch services, nail techs, and setup header on load
    window.addEventListener('DOMContentLoaded', async () => {
        // Setup Header Auth state
        const authNav = document.getElementById('authNav');
        const userBadge = document.getElementById('userBadge');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const decodedToken = token ? parseJwt(token) : null;

        if (token && decodedToken) {
            const activeUser = localStorage.getItem('username') || decodedToken.sub || decodedToken.username || 'Client';
            const role = decodedToken.role || decodedToken.authorities || (decodedToken.roles ? decodedToken.roles[0] : 'ROLE_USER');
            const isAdmin = role === 'ROLE_ADMIN' || role === 'ADMIN';

            if (userBadge && usernameDisplay) {
                usernameDisplay.textContent = activeUser;
                userBadge.classList.remove('d-none');
                userBadge.classList.add('d-inline-flex');
            }

            let adminLinkHtml = isAdmin ? `<a href="./admin-dashboard.html" class="nav-link fw-bold text-danger"><i class="bi bi-shield-lock-fill me-1"></i>Admin Portal</a>` : '';
            authNav.innerHTML = `
                <a href="./dashboard.html" class="nav-link fw-semibold text-dark">Showcase</a>
                <a href="./services.html" class="nav-link fw-semibold text-dark">Services</a>
                ${adminLinkHtml}
                <a href="./profile.html" class="nav-link fw-semibold text-dark">Profile</a>
                <a href="#" onclick="handleLogout()" class="nav-link fw-semibold text-dark">Logout</a>
                <a href="./subscription-plans.html" class="btn btn-pink rounded-pill px-4 py-2 fw-semibold">Subscription Plans</a>
            `;

            // Pre-fill user details if available in localStorage or profile API
            document.getElementById('customerName').value = activeUser;
            if (decodedToken.email) {
                document.getElementById('customerEmail').value = decodedToken.email;
            }
        } else {
            authNav.innerHTML = `
                <a href="./services.html" class="nav-link fw-semibold text-dark">Services</a>
                <a href="./login.html" class="nav-link fw-semibold text-dark">Log in</a>
                <a href="./signup.html" class="nav-link fw-semibold text-dark">Sign up</a>
                <a href="./subscription-plans.html" class="btn btn-pink rounded-pill px-4 py-2 fw-semibold">Subscription Plans</a>
            `;
        }

        // Check if user selected a design from the product catalog
        const selectedDesign = localStorage.getItem('selectedDesign');
        if (selectedDesign) {
            document.getElementById('selectedDesignBanner').textContent = `Booking for selected style: "${selectedDesign}"`;
        }

        // 1. Load Services
        try {
            const response = await fetch('/api/services');
            const services = await response.json();
            const select = document.getElementById('serviceSelect');

            select.innerHTML = '<option value="">-- Choose a Service --</option>';
            services.forEach(service => {
                const option = document.createElement('option');
                option.value = service.id;
                option.textContent = `${service.name} ($${service.price} - ${service.durationMinutes || 60} mins)`;

                // Pre-select if matches selectedDesign
                if (selectedDesign && service.name.toLowerCase().includes(selectedDesign.toLowerCase())) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        } catch (err) {
            console.error('Error loading services:', err);
            document.getElementById('serviceSelect').innerHTML = '<option value="">Error loading services</option>';
        }

        // 2. Load Nail Technicians (Staff)
        try {
            const response = await fetch('/api/nail-techs');
            const techs = await response.json();
            const select = document.getElementById('nailTechSelect');

            select.innerHTML = '<option value="">-- Choose a Nail Tech --</option>';
            techs.forEach(tech => {
                const option = document.createElement('option');
                option.value = tech.id;
                option.textContent = tech.name || tech.username;
                select.appendChild(option);
            });
        } catch (err) {
            console.error('Error loading nail techs:', err);
            document.getElementById('nailTechSelect').innerHTML = '<option value="">Error loading technicians</option>';
        }
    });

    // Handle form submit
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const bookingData = {
            customerName: document.getElementById('customerName').value,
            customerPhone: document.getElementById('customerPhone').value,
            customerEmail: document.getElementById('customerEmail').value,
            service: { id: parseInt(document.getElementById('serviceSelect').value) },
            nailTech: { id: parseInt(document.getElementById('nailTechSelect').value) },
            appointmentTime: document.getElementById('appointmentTime').value
        };

        const headers = { 'Content-Type': 'application/json' };
        if (token) {
            headers['Authorization'] = 'Bearer ' + token;
        }

        try {
            const response = await fetch('/api/appointments', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(bookingData)
            });

            if (response.ok) {
                document.getElementById('bookingForm').reset();
                document.getElementById('successMessage').classList.remove('d-none');
                localStorage.removeItem('selectedDesign');
            } else {
                const errText = await response.text();
                alert('Failed to book appointment: ' + (errText || 'Please try again.'));
            }
        } catch (err) {
            console.error('Error submitting booking:', err);
            alert('An error occurred while connecting to the server.');
        }
    });

    function handleLogout() {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('userRole');
        window.location.href = './login.html';
    }
</script>

</body>
</html>
