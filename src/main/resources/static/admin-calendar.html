            z-index: 100 !important;

            outline: 2px dashed #0d6efd;

            left: 6px;
            right: 6px;
            border-radius: 8px;

        .live-indicator-time-pill {

            left: -88px;

            color: #ffffff;
            font-size: 0.68rem;

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script>
    const token = localStorage.getItem('accessToken') || localStorage.getItem('token');

    // --- ADMIN ROUTE GUARD ---
    (function() {
        if (!token) {
            window.location.href = '/login';
            return;
        }

        const role = parseJwtRole(token);
        localStorage.setItem('userRole', role);

        if (role !== 'ROLE_ADMIN' && role !== 'ADMIN') {
            alert('Access Denied: Administrator privileges are required to view this page.');
            window.location.href = '/';
        }

        function parseJwtRole(jwtToken) {
            try {
                const base64Url = jwtToken.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const payload = JSON.parse(jsonPayload);

    function formatMinutesToTimeLabel(totalMinutes) {
        const clamped = Math.max(0, Math.min(23 * 60 + 59, Math.floor(totalMinutes)));
        const hours24 = Math.floor(clamped / 60);
        const mins = clamped % 60;
        const period = hours24 >= 12 ? 'PM' : 'AM';

        return `${hours12}:${String(mins).padStart(2, '0')} ${period}`;
    }

    const TURNOVER_BUFFER_MINUTES = 15;

    /**
     * Side-by-Side Collision Stacking Algorithm
     */
    function computeStaffColumnLayout(colAppointments, openHour) {
        if (!colAppointments || colAppointments.length === 0) return [];

        const parsed = colAppointments.map(apt => {
            const dt = new Date(apt.appointmentTime);
            const startMinutes = dt.getHours() * 60 + dt.getMinutes();
            const durationMinutes = Number((apt.service && apt.service.durationMinutes) || 45);
            const endMinutes = startMinutes + durationMinutes;
            const busyUntilMinutes = endMinutes + TURNOVER_BUFFER_MINUTES;
            return { apt, startMinutes, endMinutes, durationMinutes, busyUntilMinutes };
        });

        parsed.sort((a, b) => {
            if (a.startMinutes !== b.startMinutes) return a.startMinutes - b.startMinutes;
            return b.durationMinutes - a.durationMinutes;
        });

        const clusters = [];
        let currentCluster = [];
        let clusterEnd = -1;

        for (const item of parsed) {
            if (currentCluster.length === 0) {
                currentCluster.push(item);
                clusterEnd = item.endMinutes;
            } else if (item.startMinutes < clusterEnd) {
                currentCluster.push(item);
                clusterEnd = Math.max(clusterEnd, item.endMinutes);
            } else {
                clusters.push(currentCluster);
                currentCluster = [item];
                clusterEnd = item.endMinutes;
            }
        }
        if (currentCluster.length > 0) clusters.push(currentCluster);

        const openMinutes = openHour * 60;
        const layoutItems = [];

        for (const cluster of clusters) {
            const subColumnEnds = [];

            for (const item of cluster) {
                let assignedCol = -1;
                for (let c = 0; c < subColumnEnds.length; c++) {
                    if (subColumnEnds[c] <= item.startMinutes) {
                        assignedCol = c;
                        subColumnEnds[c] = item.endMinutes;
                        break;
                    }
                }
                if (assignedCol === -1) {
                    assignedCol = subColumnEnds.length;
                    subColumnEnds.push(item.endMinutes);
                }
                item.colIndex = assignedCol;
            }

            const totalCols = subColumnEnds.length;
            const isColliding = totalCols > 1;

            for (const item of cluster) {
                const offsetMinutes = Math.max(0, item.startMinutes - openMinutes);
                const topPx = (offsetMinutes / 60) * HOUR_ROW_HEIGHT_PX;
                const heightPx = Math.max(44, (item.durationMinutes / 60) * HOUR_ROW_HEIGHT_PX);
                const timeRangeLabel = `${formatMinutesToTimeLabel(item.startMinutes)} – ${formatMinutesToTimeLabel(item.endMinutes)}`;
                const nextFreeLabel = formatMinutesToTimeLabel(item.busyUntilMinutes);

                let leftStyle;
                let widthStyle;

                if (isColliding) {
                    const colWidthPct = 100 / totalCols;
                    leftStyle = `calc(${item.colIndex * colWidthPct}% + 3px)`;
                    widthStyle = `calc(${colWidthPct}% - 6px)`;
                } else {
                    leftStyle = '6px';
                    widthStyle = 'calc(100% - 12px)';
                }

                layoutItems.push({
                    apt: item.apt,
                    topPx,
                    heightPx,
                    leftStyle,
                    widthStyle,
                    timeRangeLabel,
                    durationMinutes: item.durationMinutes,
                    nextFreeLabel,
                    isColliding,
                    colIndex: item.colIndex,
                    totalCols
                });
            }
        }

        return layoutItems;
    }

        const [soundUnlocked, setSoundUnlocked] = useState(false);
        const [newBookingAlerts, setNewBookingAlerts] = useState([]);

        // Build an in-memory 16-bit PCM WAV data URL for a loud, crisp 3-note front-desk bell chime.
        // Using HTML5 <audio> plays on the mobile media channel (works on iPhone even when side Silent switch is on).
        const buildChimeWavUrl = () => {
            const sampleRate = 22050;
            const durationSec = 1.15;
            const numSamples = Math.floor(sampleRate * durationSec);
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, 1, true); // Mono
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            const notes = [
                { freq: 880.00,  start: 0.00, dur: 0.45, amp: 0.78 },
                { freq: 1108.73, start: 0.14, dur: 0.45, amp: 0.78 },
                { freq: 1318.51, start: 0.28, dur: 0.80, amp: 0.90 }
            ];
            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                let sample = 0;
                for (let n = 0; n < notes.length; n++) {
                    const note = notes[n];
                    const dt = t - note.start;
                    if (dt >= 0 && dt <= note.dur) {
                        const attack = Math.min(1, dt / 0.012);
                        const decay = Math.exp(-3.6 * (dt / note.dur));
                        const env = attack * decay;
                        const phase = (dt * note.freq) % 1;
                        const tri = 4 * Math.abs(phase - 0.5) - 1;
                        const overtone = Math.sin(2 * Math.PI * note.freq * 2 * dt);
                        sample += (tri * 0.75 + overtone * 0.28) * note.amp * env;
                    }
                }
                // Soft limiter to maximize perceived volume without harsh digital clipping
                const limited = Math.tanh(sample * 1.35);
                view.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.round(limited * 32767))), true);
            }
            const blob = new Blob([buffer], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        };

        // Initialize persistent HTML5 Audio element + unlock audio reliably on mobile (iOS Safari / Android Chrome)
        useEffect(() => {
            let objectUrl = null;
            try {
                objectUrl = buildChimeWavUrl();
                const audio = new Audio(objectUrl);
                audio.preload = 'auto';
                audio.volume = 1.0;
                audio.setAttribute('playsinline', 'true');
                chimeAudioRef.current = audio;
            } catch (_) {}

            const unlockOnGesture = () => {
                if (soundUnlockedRef.current) return;
                // 1. Unlock Web Audio API with a 1-sample silent buffer (required by iOS Safari)
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        if (!audioCtxRef.current || audioCtxRef.current.state === 'closed') {
                            audioCtxRef.current = new AudioCtx();
                        }
                        const ctx = audioCtxRef.current;
                        if (ctx.state === 'suspended') {
                            ctx.resume().catch(() => {});
                        }
                        const silentBuf = ctx.createBuffer(1, 1, 22050);
                        const src = ctx.createBufferSource();
                        src.buffer = silentBuf;
                        src.connect(ctx.destination);
                        src.start(0);
                    }
                } catch (_) {}

                // 2. Unlock persistent HTML5 <audio> element silently inside the user tap/click
                const audio = chimeAudioRef.current;
                if (audio) {
                    const prevMuted = audio.muted;
                    audio.muted = true;
                    const p = audio.play();
                    if (p && typeof p.then === 'function') {
                        p.then(() => {
                            audio.pause();
                            audio.currentTime = 0;
                            audio.muted = prevMuted;
                            soundUnlockedRef.current = true;
                            setSoundUnlocked(true);
                        }).catch(() => {
                            audio.muted = prevMuted;
                        });
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                        audio.muted = prevMuted;
                        soundUnlockedRef.current = true;
                        setSoundUnlocked(true);
                    }
                }
            };

            // Do NOT use { once: true } — keep trying on real taps/clicks until browser confirms unlock
            window.addEventListener('touchend', unlockOnGesture, { passive: true });
            window.addEventListener('click', unlockOnGesture, { passive: true });
            window.addEventListener('keydown', unlockOnGesture, { passive: true });
            return () => {
                window.removeEventListener('touchend', unlockOnGesture);
                window.removeEventListener('click', unlockOnGesture);
                window.removeEventListener('keydown', unlockOnGesture);
                if (objectUrl) {

        const playWebAudioFallback = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!audioCtxRef.current || audioCtxRef.current.state === 'closed') {
                    audioCtxRef.current = new AudioCtx();
                }
                const ctx = audioCtxRef.current;
                if (ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }
                const compressor = ctx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-12, ctx.currentTime);
                compressor.knee.setValueAtTime(10, ctx.currentTime);
                compressor.ratio.setValueAtTime(6, ctx.currentTime);
                compressor.connect(ctx.destination);

                const notes = [
                    { freq: 880.00,  start: 0.00, dur: 0.45, peak: 0.65 },
                    { freq: 1108.73, start: 0.14, dur: 0.45, peak: 0.65 },
                    { freq: 1318.51, start: 0.28, dur: 0.75, peak: 0.75 }
                ];
                const baseTime = ctx.currentTime + 0.01;
                notes.forEach(({ freq, start, dur, peak }) => {

            const startMins = dt.getHours() * 60 + dt.getMinutes();
            const duration = Number((apt.service && apt.service.durationMinutes) || 45);

            const buffer = 15;

            const offMap = (aptDateKey === selectedDateKey)

            const sameDayAppts = appointments.filter(other => {
                if (!other || !other.appointmentTime || other.id === apt.id) return false;

                        isFree: false,

        const getMondayOfCurrentWeek = () => {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            return monday.toISOString().split('T')[0];
        };

        const getSundayOfCurrentWeek = () => {
            const d = new Date();
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? 0 : 7);
            const sunday = new Date(d.setDate(diff));
            return sunday.toISOString().split('T')[0];
        };

                serviceIds: walkInModal.selectedServiceIds.map(Number),

                'Content-Type': 'application/json',
                'X-Tenant-ID': activeTenant,
                ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            };

            try {
                const res = await fetch('/api/appointments', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || 'Failed to create walk-in appointment.');
                }

                setWalkInModal(prev => ({ ...prev, isOpen: false, saving: false }));
                await fetchScheduleData(true);
            } catch (err) {

                                            h('div', { className: 'small text-muted text-uppercase', style: { fontSize: '0.7rem' } }, 'No-Shows')
                                        )
                                    )
                                ),
                                h('h6', { className: 'fw-bold text-dark mb-2' }, 'Chronological Audit History'),
                                h('div', { style: { maxHeight: '280px', overflowY: 'auto' }, className: 'border rounded-3 p-2 bg-white' },
                                    (customerHistoryModal.data.activityLogs || []).length === 0
                                        ? h('p', { className: 'text-muted small p-2 mb-0' }, 'No activity events recorded.')
                                        : (customerHistoryModal.data.activityLogs || []).map(log =>
                                            h('div', { key: log.id, className: 'p-2 border-bottom small' },
                                                h('div', { className: 'd-flex justify-content-between align-items-center' },
                                                    h('span', { className: `badge ${log.actionType === 'BOOKED' ? 'bg-primary' : log.actionType === 'CONFIRMED' ? 'bg-success' : log.actionType === 'CANCELLED' ? 'bg-danger' : log.actionType === 'NO_SHOW' ? 'bg-warning text-dark' : 'bg-info text-dark'}` }, log.actionType),
                                                    h('span', { className: 'text-muted' }, new Date(log.createdAt).toLocaleString())
                                                ),
                                                h('div', { className: 'mt-1 text-dark' }, log.notes || 'Status changed'),
                                                h('div', { className: 'text-muted', style: { fontSize: '0.75rem' } }, `Performed by: ${log.performedBy || 'SYSTEM'}`)
                                            )
                                        )
                                )
                            )
                        ),
                        h('div', { className: 'modal-footer' },
                            h('button', {
                                type: 'button',
                                className: 'btn btn-sm btn-secondary',
                                onClick: () => setCustomerHistoryModal({ isOpen: false, loading: false, data: null, error: null, title: '' })
                            }, 'Close')
                        )
                    )
                )
            ),

            /* Gift Cards Management Modal */
            giftCardsModal.isOpen && h('div', {
                className: 'modal show d-block',
                style: { backgroundColor: 'rgba(15, 23, 42, 0.65)', zIndex: 1070 },
                tabIndex: -1,
                onClick: () => !giftCardsModal.issuing && setGiftCardsModal(prev => ({ ...prev, isOpen: false, error: null }))
            },
                h('div', {
                    className: 'modal-dialog modal-dialog-centered modal-lg',
                    style: { maxWidth: '840px' },
                    onClick: (e) => e.stopPropagation()
                },
                    h('div', { className: 'modal-content border-0 shadow-lg rounded-4 overflow-hidden' },
                        /* Header */
                        h('div', { className: 'modal-header bg-light border-bottom py-3 px-4 d-flex justify-content-between align-items-center' },
                            h('div', { className: 'd-flex align-items-center gap-3' },
                                h('div', { className: 'p-2 bg-warning-subtle text-warning rounded-3 fs-4' },
                                    h('i', { className: 'bi bi-gift-fill' })
                                ),
                                h('div', null,
                                    h('h5', { className: 'modal-title fw-bold text-dark mb-0' }, 'Salon Gift Cards & Balances'),
                                    h('div', { className: 'small text-muted' }, 'Issue, verify and track customer gift cards and outstanding balances')
                                )
                            ),
                            h('button', {
                                type: 'button',
                                className: 'btn-close',
                                disabled: giftCardsModal.issuing,
                                onClick: () => setGiftCardsModal(prev => ({ ...prev, isOpen: false, error: null }))
                            })
                        ),

                        /* Body */
                        h('div', { className: 'modal-body p-4', style: { maxHeight: '78vh', overflowY: 'auto' } },
                            giftCardsModal.error && h('div', { className: 'alert alert-danger py-2 px-3 small mb-3' }, giftCardsModal.error),

                            /* Newly Issued Card Highlight */
                            giftCardsModal.newlyIssuedCard && h('div', {
                                className: 'alert alert-warning border-2 border-warning rounded-4 p-3 mb-4 shadow-sm'
                            },
                                h('div', { className: 'd-flex justify-content-between align-items-center mb-2' },
                                    h('span', { className: 'fw-bold text-dark d-flex align-items-center gap-1' }, [
                                        h('i', { className: 'bi bi-check-circle-fill text-success' }),
                                        'New Gift Card Successfully Issued!'
                                    ]),
                                    h('button', {
                                        type: 'button',
                                        className: 'btn-close btn-close-sm',
                                        onClick: () => setGiftCardsModal(prev => ({ ...prev, newlyIssuedCard: null }))
                                    })
                                ),
                                h('div', { className: 'd-flex justify-content-between align-items-center bg-white p-3 rounded-3 border' },
                                    h('div', null,
                                        h('div', { className: 'extra-small text-muted text-uppercase fw-bold' }, 'Gift Card Code'),
                                        h('div', { className: 'fs-3 fw-bold text-dark font-monospace' }, giftCardsModal.newlyIssuedCard.code),
                                        h('div', { className: 'small text-muted' },
                                            `Balance: $${Number(giftCardsModal.newlyIssuedCard.initialBalance).toFixed(2)}` +
                                            (giftCardsModal.newlyIssuedCard.recipientName ? ` • Recipient: ${giftCardsModal.newlyIssuedCard.recipientName}` : '')
                                        )
                                    ),
                                    h('button', {
                                        type: 'button',
                                        className: 'btn btn-warning btn-sm px-3 fw-bold d-flex align-items-center gap-1 text-dark shadow-sm',
                                        onClick: () => {
                                            if (navigator.clipboard) {
                                                navigator.clipboard.writeText(giftCardsModal.newlyIssuedCard.code);
                                                alert(`Copied gift card code ${giftCardsModal.newlyIssuedCard.code} to clipboard!`);
                                            }
                                        }
                                    }, [
                                        h('i', { className: 'bi bi-clipboard me-1' }),
                                        'Copy Code'
                                    ])
                                )
                            ),

                            /* Issue New Card Panel */
                            h('div', { className: 'card border-0 bg-light rounded-4 p-3 mb-4' },
                                h('div', { className: 'small fw-bold text-uppercase text-secondary mb-2 d-flex align-items-center gap-1', style: { letterSpacing: '0.5px' } }, [
                                    h('i', { className: 'bi bi-plus-circle-fill text-warning' }),
                                    'Issue New Salon Gift Card'
                                ]),
                                /* Amount Presets */
                                h('div', { className: 'mb-3' },
                                    h('label', { className: 'extra-small fw-semibold text-secondary mb-1' }, 'Card Value / Initial Balance:'),
                                    h('div', { className: 'd-flex flex-wrap gap-2 align-items-center' },
                                        ['25.00', '50.00', '75.00', '100.00', '150.00'].map(val =>
                                            h('button', {
                                                key: val,
                                                type: 'button',
                                                className: `btn btn-sm py-1 px-3 rounded-pill fw-bold ${giftCardsModal.issueAmount === val ? 'btn-warning text-dark shadow-sm' : 'btn-outline-secondary bg-white'}`,
                                                style: { fontSize: '0.8rem' },
                                                onClick: () => setGiftCardsModal(prev => ({ ...prev, issueAmount: val }))
                                            }, `$${parseFloat(val).toFixed(0)}`)
                                        ),
                                        h('div', { className: 'input-group input-group-sm', style: { maxWidth: '140px' } },
                                            h('span', { className: 'input-group-text bg-white' }, '$'),
                                            h('input', {
                                                type: 'number',
                                                step: '5.00',
                                                className: 'form-control',
                                                placeholder: 'Custom',
                                                value: giftCardsModal.issueAmount,
                                                onChange: (e) => setGiftCardsModal(prev => ({ ...prev, issueAmount: e.target.value }))
                                            })
                                        )
                                    )
                                ),
                                /* Purchaser & Recipient Inputs */
                                h('div', { className: 'row g-2 mb-2' },
                                    h('div', { className: 'col-md-6' },
                                        h('input', {
                                            type: 'text',
                                            className: 'form-control form-control-sm',
                                            placeholder: 'Purchaser Name (optional)',
                                            value: giftCardsModal.issuePurchaserName,
                                            onChange: (e) => setGiftCardsModal(prev => ({ ...prev, issuePurchaserName: e.target.value }))
                                        })
                                    ),
                                    h('div', { className: 'col-md-6' },
                                        h('input', {
                                            type: 'text',
                                            className: 'form-control form-control-sm',
                                            placeholder: 'Recipient Name (optional)',
                                            value: giftCardsModal.issueRecipientName,
                                            onChange: (e) => setGiftCardsModal(prev => ({ ...prev, issueRecipientName: e.target.value }))
                                        })
                                    )
                                ),
                                h('div', { className: 'row g-2 mb-3' },
                                    h('div', { className: 'col-md-6' },
                                        h('input', {
                                            type: 'text',
                                            className: 'form-control form-control-sm text-uppercase',
                                            placeholder: 'Custom Code (optional, or auto-generate)',
                                            value: giftCardsModal.customCode,
                                            onChange: (e) => setGiftCardsModal(prev => ({ ...prev, customCode: e.target.value.toUpperCase() }))
                                        })
                                    ),
                                    h('div', { className: 'col-md-6' },
                                        h('input', {
                                            type: 'text',
                                            className: 'form-control form-control-sm',
                                            placeholder: 'Notes / Memo (e.g. Birthday gift, promo)',
                                            value: giftCardsModal.issueNotes,
                                            onChange: (e) => setGiftCardsModal(prev => ({ ...prev, issueNotes: e.target.value }))
                                        })
                                    )
                                ),
                                h('div', { className: 'text-end' },
                                    h('button', {
                                        type: 'button',
                                        className: 'btn btn-warning px-4 py-1 btn-sm fw-bold text-dark shadow-sm',
                                        disabled: giftCardsModal.issuing,
                                        onClick: handleIssueGiftCard
                                    }, giftCardsModal.issuing ? 'Issuing Gift Card...' : [
                                        h('i', { className: 'bi bi-plus-lg me-1' }),
                                        `Issue $${parseFloat(giftCardsModal.issueAmount || 0).toFixed(2)} Gift Card`
                                    ])
                                )
                            ),

                            /* Cards Table */
                            h('div', { className: 'card border-0 shadow-sm rounded-4' },
                                h('div', { className: 'card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center' },
                                    h('h6', { className: 'fw-bold text-dark mb-0 d-flex align-items-center gap-2' }, [
                                        h('i', { className: 'bi bi-list-stars text-warning' }),
                                        `Issued Gift Cards Registry (${(giftCardsModal.cards || []).length})`
                                    ]),
                                    h('div', { className: 'd-flex gap-1' },
                                        ['ALL', 'ACTIVE', 'DEPLETED'].map(flt =>
                                            h('button', {
                                                key: flt,
                                                type: 'button',
                                                className: `btn btn-sm py-0 px-2 rounded-pill fw-semibold ${giftCardsModal.filter === flt ? 'btn-secondary text-white' : 'btn-outline-secondary'}`,
                                                style: { fontSize: '0.72rem' },
                                                onClick: () => setGiftCardsModal(prev => ({ ...prev, filter: flt }))
                                            }, flt)
                                        )
                                    )
                                ),
                                h('div', { className: 'table-responsive' },
                                    h('table', { className: 'table table-hover align-middle mb-0' },
                                        h('thead', { className: 'table-light small text-uppercase text-secondary' },
                                            h('tr', null,
                                                h('th', null, 'Card Code'),
                                                h('th', null, 'Recipient / Purchaser'),
                                                h('th', { className: 'text-end' }, 'Current Balance'),
                                                h('th', { className: 'text-end' }, 'Initial'),
                                                h('th', { className: 'text-center' }, 'Status'),
                                                h('th', { className: 'text-end' }, 'Actions')
                                            )
                                        ),
                                        h('tbody', null,
                                            giftCardsModal.loading
                                                ? h('tr', null, h('td', { colSpan: 6, className: 'text-center text-muted py-4' }, 'Loading gift cards...'))
                                                : (giftCardsModal.cards || [])
                                                    .filter(c => giftCardsModal.filter === 'ALL' || (c.status || '').toUpperCase() === giftCardsModal.filter)
                                                    .length === 0
                                                    ? h('tr', null, h('td', { colSpan: 6, className: 'text-center text-muted py-4' }, 'No gift cards found.'))
                                                    : (giftCardsModal.cards || [])
                                                        .filter(c => giftCardsModal.filter === 'ALL' || (c.status || '').toUpperCase() === giftCardsModal.filter)
                                                        .map(c =>
                                                            h('tr', { key: c.id },
                                                                h('td', { className: 'fw-bold text-dark font-monospace' }, [
                                                                    h('span', { className: 'badge bg-light text-dark border me-1' }, c.code),
                                                                    h('button', {
                                                                        type: 'button',
                                                                        className: 'btn btn-outline-secondary btn-sm py-0 px-1 border-0',
                                                                        title: 'Copy Code',
                                                                        onClick: () => {
                                                                            if (navigator.clipboard) navigator.clipboard.writeText(c.code);
                                                                        }
                                                                    }, h('i', { className: 'bi bi-clipboard extra-small' }))
                                                                ]),
                                                                h('td', { className: 'small' },
                                                                    h('div', { className: 'fw-semibold text-dark' }, c.recipientName || c.purchaserName || 'General Customer'),
                                                                    c.notes && h('div', { className: 'extra-small text-muted fst-italic' }, c.notes)
                                                                ),
                                                                h('td', { className: 'text-end fw-bold fs-6 text-success' }, `$${Number(c.currentBalance || 0).toFixed(2)}`),
                                                                h('td', { className: 'text-end text-muted small' }, `$${Number(c.initialBalance || 0).toFixed(2)}`),
                                                                h('td', { className: 'text-center' },
                                                                    h('span', {
                                                                        className: `badge ${c.status === 'ACTIVE' ? 'bg-success-subtle text-success border border-success-subtle' : c.status === 'DEPLETED' ? 'bg-secondary-subtle text-secondary border' : 'bg-danger-subtle text-danger'}`
                                                                    }, c.status || 'ACTIVE')
                                                                ),
                                                                h('td', { className: 'text-end' },
                                                                    c.status === 'ACTIVE'
                                                                        ? h('button', {
                                                                            type: 'button',
                                                                            className: 'btn btn-outline-secondary btn-sm py-0 px-2 extra-small',
                                                                            title: 'Mark as Depleted',
                                                                            onClick: () => handleUpdateGiftCardStatus(c.id, 'DEPLETED')
                                                                        }, 'Deplete')
                                                                        : h('button', {
                                                                            type: 'button',
                                                                            className: 'btn btn-outline-success btn-sm py-0 px-2 extra-small',
                                                                            title: 'Reactivate Card',
                                                                            onClick: () => handleUpdateGiftCardStatus(c.id, 'ACTIVE')
                                                                        }, 'Reactivate')
                                                                )
                                                            )
                                                        )
                                        )
                                    )
                                )
                            )
                        ),

                        /* Footer */
                        h('div', { className: 'modal-footer bg-light border-top p-3' },
                            h('button', {
                                type: 'button',
                                className: 'btn btn-secondary btn-sm px-4 fw-semibold',
                                onClick: () => setGiftCardsModal(prev => ({ ...prev, isOpen: false, error: null }))
                            }, 'Close')
                        )
                    )
                )
            ),

            /* 6. Drag & Drop Toast Alert Notification */
            dragToast && h('div', {
                className: `drag-toast alert alert-${dragToast.type} alert-dismissible fade show d-flex align-items-center justify-content-between py-2 px-3 m-0 shadow`,
                role: 'alert'
            },
                h('div', { className: 'd-flex align-items-center gap-2 small fw-semibold' },
                    dragToast.message
                ),
                h('button', {
                    type: 'button',
                    className: 'btn-close btn-close-sm ms-2',
                    onClick: () => setDragToast(null)
                })
            )
        );
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadBranding();
        const rootEl = document.getElementById('adminTimelineRoot');
        if (rootEl && window.ReactDOM) {
            const root = ReactDOM.createRoot(rootEl);
            root.render(React.createElement(AdminDailyTimelineCalendar));
        }
    });
</script>
</body>
</html>
