<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Daily Staff Timeline - Jenny's Nail Studio</title>
    <!-- Favicon Tag -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?=v2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --timeline-axis-width: 94px;
            --timeline-border: #e9ecef;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
            color: #fff;
        }
        .btn-pink:hover {
            filter: brightness(0.92);
            color: #fff;
        }

        /* ==========================================================================
           Daily Staff Timeline Grid & Real-Time Indicator Styles
           ========================================================================== */
        .admin-timeline-wrapper {
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
        }

        .calendar-date-badge {
            width: 56px;
            height: 56px;
            background: rgba(233, 30, 99, 0.08);
            border: 1px solid rgba(233, 30, 99, 0.22);
            color: var(--bs-primary-pink);
            line-height: 1.1;
            flex-shrink: 0;
        }
        .calendar-date-badge .month-abbr {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }
        .calendar-date-badge .day-num {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .live-today-badge {
            background-color: rgba(25, 135, 84, 0.12);
            color: #198754;
            border: 1px solid rgba(25, 135, 84, 0.25);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .timeline-date-picker {
            width: auto;
            min-width: 148px;
            font-weight: 600;
        }

        .timeline-scroll-container {
            overflow-x: auto;
            overflow-y: visible;
            position: relative;
        }

        /* Sticky Staff Column Header Row */
        .timeline-staff-header-row {
            display: flex;
            background-color: #f8f9fa;
            border-bottom: 2px solid var(--timeline-border);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .timeline-time-gutter-header {
            width: var(--timeline-axis-width);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--timeline-border);
            padding: 14px 8px;
            background-color: #f8f9fa;
        }

        .timeline-staff-col-header {
            flex: 1 1 0;
            min-width: 175px;
            padding: 12px 10px;
            border-right: 1px solid var(--timeline-border);
            background: #ffffff;
        }

        .staff-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(233, 30, 99, 0.12);
            color: var(--bs-primary-pink);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .staff-header-name {
            font-size: 0.9rem;
            max-width: 125px;
        }

        .extra-small {
            font-size: 0.72rem;
        }

        /* Main Vertical Time Axis + Staff Columns Canvas */
        .timeline-body-area {
            display: flex;
            position: relative;
            background-color: #ffffff;
            margin-bottom: 20px;
        }

        .timeline-time-axis {
            width: var(--timeline-axis-width);
            flex-shrink: 0;
            position: relative;
            border-right: 1px solid var(--timeline-border);
            background-color: #fcfcfd;
            user-select: none;
        }

        .timeline-axis-tick {
            position: absolute;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            text-align: right;
            padding-right: 12px;
        }

        .axis-time-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: #6c757d;
        }

        .timeline-columns-canvas {
            flex: 1;
            display: flex;
            position: relative;
        }

        .timeline-hour-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px solid #e9ecef;
            pointer-events: none;
            z-index: 1;
        }

        .timeline-half-hour-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #f1f3f5;
            pointer-events: none;
            z-index: 1;
        }

        .timeline-staff-column {
            flex: 1 1 0;
            min-width: 175px;
            position: relative;
            border-right: 1px solid var(--timeline-border);
            z-index: 2;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .timeline-staff-column:hover {
            background-color: rgba(233, 30, 99, 0.035);
        }

        /* Appointment Block Cards */
        .timeline-appt-block {
            position: absolute;
            left: 6px;
            right: 6px;
            border-radius: 8px;
            padding: 6px 8px;
            cursor: pointer;
            overflow: hidden;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            border-left: 4px solid #198754;
            background-color: #ebfbee;
            color: #145a32;
        }

        .timeline-appt-block:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.16);
            z-index: 10;
        }

        /* Side-by-side collision stacking styles */
        .timeline-appt-block.is-colliding {
            box-shadow: 0 2px 8px rgba(245, 159, 0, 0.22);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-left-width: 4px;
        }

        .collision-badge {
            font-size: 0.62rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
            background-color: rgba(245, 159, 0, 0.2);
            color: #855b00;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        /* Quick Walk-In Modal Styling */
        .walkin-service-catalog {
            max-height: 210px;
            overflow-y: auto;
        }

        .service-select-card {
            transition: all 0.15s ease;
            user-select: none;
            cursor: pointer;
        }

        .service-select-card:hover {
            border-color: var(--bs-primary-pink);
            background-color: #fff9fb;
        }

        .service-select-card.selected {
            border-color: var(--bs-primary-pink) !important;
            background-color: #fff0f5 !important;
        }

        .border-pink {
            border-color: var(--bs-primary-pink) !important;
        }

        .timeline-appt-block.status-pending {
            border-left-color: #f59f00;
            background-color: #fff9db;
            color: #7c4d00;
        }

        .timeline-appt-block.status-confirmed {
            border-left-color: #198754;
            background-color: #ebfbee;
            color: #145a32;
        }

        .timeline-appt-block.status-cancelled {
            border-left-color: #dc3545;
            background-color: #fff5f5;
            color: #842029;
            opacity: 0.7;
            text-decoration: line-through;
        }

        .timeline-appt-block.status-no_show {
            border-left-color: #fd7e14;
            background-color: #fff4e6;
            color: #d9480f;
            opacity: 0.85;
            border-style: dashed;
        }

        .appt-time-badge {
            font-size: 0.68rem;
            font-weight: 700;
            opacity: 0.88;
        }

        .appt-customer-name {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .appt-service-name {
            font-size: 0.72rem;
            opacity: 0.9;
        }

        /* Real-Time Horizontal Time Indicator */
        .timeline-live-indicator {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 15;
            pointer-events: none;
            display: flex;
            align-items: center;
            transition: top 0.6s linear;
        }

        .timeline-live-indicator.outside-hours {
            opacity: 0.55;
        }

        .live-indicator-time-pill {
            position: absolute;
            left: -88px;
            background-color: #ff2b56;
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(255, 43, 86, 0.35);
            white-space: nowrap;
        }

        .live-pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #ffffff;
            animation: timelinePulse 1.8s infinite ease-in-out;
        }

        .live-indicator-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #ff2b56 0%, rgba(255, 43, 86, 0.75) 100%);
            box-shadow: 0 0 8px rgba(255, 43, 86, 0.4);
        }

        @keyframes timelinePulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.45);
                opacity: 0.55;
            }
        }
    </style>

<script>
    const token = localStorage.getItem('accessToken') || localStorage.getItem('token');

    // --- ADMIN ROUTE GUARD ---
    (function() {
        if (!token) {
            window.location.href = './login.html';
            return;
        }

        const role = parseJwtRole(token);
        localStorage.setItem('userRole', role);

        if (role !== 'ROLE_ADMIN' && role !== 'ADMIN') {
            alert('Access Denied: Administrator privileges are required to view this page.');
            window.location.href = './index.html';
        }

        function parseJwtRole(jwtToken) {
            try {
                const base64Url = jwtToken.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const payload = JSON.parse(jsonPayload);
                return payload.role || payload.authorities || (payload.roles ? payload.roles[0] : null) || 'ROLE_USER';
            } catch (e) {
                console.error('Failed to parse JWT role:', e);
                return 'ROLE_USER';
            }
        }
    })();

    function getActiveTenant() {
        const urlParams = new URLSearchParams(window.location.search);
        const queryTenant = urlParams.get('tenant');
        if (queryTenant) return queryTenant.toLowerCase();

        const host = window.location.hostname.toLowerCase();
        if (host.startsWith('luxe.')) return 'luxe';

        const storedTenant = localStorage.getItem('tenant');
        if (storedTenant) return storedTenant.toLowerCase();

        return 'default';
    }

    const activeTenant = getActiveTenant();
    localStorage.setItem('tenant', activeTenant);

    // Apply navigation links
    const tenantQuery = `?tenant=${encodeURIComponent(activeTenant)}`;
    document.getElementById('navDashboardLink').href = `./admin-dashboard.html${tenantQuery}`;
    if (document.getElementById('navCalendarLink')) {
        document.getElementById('navCalendarLink').href = `./admin-calendar.html${tenantQuery}`;
    }
    document.getElementById('navTechsLink').href = `./nail-techs.html${tenantQuery}`;
    document.getElementById('navCustomersLink').href = `./admin-customers.html${tenantQuery}`;
    document.getElementById('navWebsiteLink').href = activeTenant === 'luxe' ? `./booking.html${tenantQuery}` : `./index.html${tenantQuery}`;

    async function loadBranding() {
        try {
            const resp = await fetch(`/api/public/tenant-config?tenant=${encodeURIComponent(activeTenant)}`);
            if (resp.ok) {
                const cfg = await resp.json();
                const name = cfg.salonName || (activeTenant === 'luxe' ? 'Luxe Nail & Spa Sanctuary' : "Jenny's Nail Studio");
                const primaryColor = cfg.primaryColor || (activeTenant === 'luxe' ? '#00b4d8' : '#e91e63');

                document.documentElement.style.setProperty('--bs-primary-pink', primaryColor);
                document.getElementById('pageTitle').innerText = `Daily Staff Timeline - ${name}`;
                document.getElementById('portalBrandTitle').innerText = `${name} Portal`;
                document.getElementById('footerCopyright').innerHTML = `&copy; ${name} — Appointment Management System`;

                const pill = document.getElementById('tenantPill');
                if (pill) {
                    pill.innerText = activeTenant.toUpperCase();
                    pill.style.backgroundColor = primaryColor;
                    pill.classList.remove('bg-secondary');
                }
            }
        } catch (e) {
            console.warn('Branding load fallback:', e);
        }
    }

    function handleLogout() {
        const tenant = getActiveTenant();
        localStorage.removeItem('accessToken');
        localStorage.removeItem('token');
        localStorage.removeItem('userRole');
        localStorage.removeItem('tenant');
        window.location.href = tenant === 'luxe' ? './login.html?tenant=luxe' : './index.html';
    }

    // ==================== REACT DAILY STAFF TIMELINE COMPONENT ====================
    const { useState, useEffect, useMemo, useCallback } = React;
    const h = React.createElement;

    const DEFAULT_OPEN_HOUR = 10; // 10:00 AM
    const DEFAULT_CLOSE_HOUR = 19; // 7:00 PM
    const HOUR_ROW_HEIGHT_PX = 88; // 88px per hour

    function getStaffPronouns(tech) {
        if (!tech) return '';
        const raw = (tech.name || tech.username || '').trim().toLowerCase();
        const first = raw.split(/[\s@._]/)[0];
        const maleNames = ['tony', 'michael', 'david', 'john', 'alex', 'kevin', 'brian', 'james', 'robert', 'daniel', 'chris', 'ryan'];
        return maleNames.includes(first) ? 'he/him' : 'she/her';
    }

    function formatFullDayHeader(dateObj) {
        return dateObj.toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });
    }

    function toDateKey(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatMinutesToTimeLabel(totalMinutes) {
        const clamped = Math.max(0, Math.min(23 * 60 + 59, Math.floor(totalMinutes)));
        const hours24 = Math.floor(clamped / 60);
        const mins = clamped % 60;
        const period = hours24 >= 12 ? 'PM' : 'AM';
        const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
        return `${hours12}:${String(mins).padStart(2, '0')} ${period}`;
    }

    /**
     * Side-by-Side Collision Stacking Algorithm
     */
    function computeStaffColumnLayout(colAppointments, openHour) {
        if (!colAppointments || colAppointments.length === 0) return [];

        const parsed = colAppointments.map(apt => {
            const dt = new Date(apt.appointmentTime);
            const startMinutes = dt.getHours() * 60 + dt.getMinutes();
            const durationMinutes = Number((apt.service && apt.service.durationMinutes) || 45);
            const endMinutes = startMinutes + durationMinutes;
            return { apt, startMinutes, endMinutes, durationMinutes };
        });

        parsed.sort((a, b) => {
            if (a.startMinutes !== b.startMinutes) return a.startMinutes - b.startMinutes;
            return b.durationMinutes - a.durationMinutes;
        });

        const clusters = [];
        let currentCluster = [];
        let clusterEnd = -1;

        for (const item of parsed) {
            if (currentCluster.length === 0) {
                currentCluster.push(item);
                clusterEnd = item.endMinutes;
            } else if (item.startMinutes < clusterEnd) {
                currentCluster.push(item);
                clusterEnd = Math.max(clusterEnd, item.endMinutes);
            } else {
                clusters.push(currentCluster);
                currentCluster = [item];
                clusterEnd = item.endMinutes;
            }
        }
        if (currentCluster.length > 0) clusters.push(currentCluster);

        const openMinutes = openHour * 60;
        const layoutItems = [];

        for (const cluster of clusters) {
            const subColumnEnds = [];

            for (const item of cluster) {
                let assignedCol = -1;
                for (let c = 0; c < subColumnEnds.length; c++) {
                    if (subColumnEnds[c] <= item.startMinutes) {
                        assignedCol = c;
                        subColumnEnds[c] = item.endMinutes;
                        break;
                    }
                }
                if (assignedCol === -1) {
                    assignedCol = subColumnEnds.length;
                    subColumnEnds.push(item.endMinutes);
                }
                item.colIndex = assignedCol;
            }

            const totalCols = subColumnEnds.length;
            const isColliding = totalCols > 1;

            for (const item of cluster) {
                const offsetMinutes = Math.max(0, item.startMinutes - openMinutes);
                const topPx = (offsetMinutes / 60) * HOUR_ROW_HEIGHT_PX;
                const heightPx = Math.max(38, (item.durationMinutes / 60) * HOUR_ROW_HEIGHT_PX);
                const timeRangeLabel = `${formatMinutesToTimeLabel(item.startMinutes)} – ${formatMinutesToTimeLabel(item.endMinutes)}`;

                let leftStyle;
                let widthStyle;

                if (isColliding) {
                    const colWidthPct = 100 / totalCols;
                    leftStyle = `calc(${item.colIndex * colWidthPct}% + 3px)`;
                    widthStyle = `calc(${colWidthPct}% - 6px)`;
                } else {
                    leftStyle = '6px';
                    widthStyle = 'calc(100% - 12px)';
                }

                layoutItems.push({
                    apt: item.apt,
                    topPx,
                    heightPx,
                    leftStyle,
                    widthStyle,
                    timeRangeLabel,
                    isColliding,
                    colIndex: item.colIndex,
                    totalCols
                });
            }
        }

        return layoutItems;
    }

    function AdminDailyTimelineCalendar() {
        const [selectedDate, setSelectedDate] = useState(() => new Date());
        const [staffList, setStaffList] = useState([]);
        const [appointments, setAppointments] = useState([]);
        const [servicesCatalog, setServicesCatalog] = useState([]);
        const [loading, setLoading] = useState(true);
        const [selectedAppointment, setSelectedAppointment] = useState(null);
        const [statusReason, setStatusReason] = useState('');
        const [now, setNow] = useState(() => new Date());

        const [walkInModal, setWalkInModal] = useState({
            isOpen: false,
            techId: null,
            techName: '',
            isUnassigned: false,
            date: '',
            time: '10:00',
            customerName: '',
            customerPhone: '',
            customerEmail: '',
            selectedServiceIds: [],
            notes: '',
            saving: false,
            error: null
        });

        // Real-time useEffect timer updating the timeline indicator
        useEffect(() => {
            setNow(new Date());
            const intervalId = setInterval(() => {
                setNow(new Date());
            }, 15000);
            return () => clearInterval(intervalId);
        }, []);

        const totalStoreHours = DEFAULT_CLOSE_HOUR - DEFAULT_OPEN_HOUR;
        const totalStoreMinutes = totalStoreHours * 60;
        const totalGridHeightPx = totalStoreHours * HOUR_ROW_HEIGHT_PX;

        const fetchScheduleData = useCallback(async (silent = false) => {
            if (!silent) setLoading(true);
            const headers = {
                'X-Tenant-ID': activeTenant,
                ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            };

            try {
                const [staffRes, apptRes, srvRes] = await Promise.all([
                    fetch('/api/nail-techs', { headers }),
                    fetch('/api/appointments', { headers }),
                    fetch('/api/services', { headers })
                ]);
                const staffData = staffRes.ok ? await staffRes.json() : [];
                const apptData = apptRes.ok ? await apptRes.json() : [];
                const srvData = srvRes.ok ? await srvRes.json() : [];

                setStaffList(Array.isArray(staffData) ? staffData : []);
                setAppointments(Array.isArray(apptData) ? apptData : []);
                setServicesCatalog(Array.isArray(srvData) ? srvData : []);
            } catch (err) {
                console.error('Error loading timeline data:', err);
            } finally {
                if (!silent) setLoading(false);
            }
        }, []);

        useEffect(() => {
            fetchScheduleData();
            // Background polling every 30 seconds for live updates
            const pollId = setInterval(() => {
                fetchScheduleData(true);
            }, 30000);
            return () => clearInterval(pollId);
        }, [fetchScheduleData]);

        const selectedDateKey = useMemo(() => toDateKey(selectedDate), [selectedDate]);
        const isSelectedDateToday = useMemo(() => toDateKey(now) === selectedDateKey, [now, selectedDateKey]);

        const dayAppointments = useMemo(() => {
            return appointments.filter(apt => {
                if (!apt.appointmentTime) return false;
                return String(apt.appointmentTime).split('T')[0] === selectedDateKey;
            });
        }, [appointments, selectedDateKey]);

        const staffColumns = useMemo(() => {
            const cols = staffList.map(tech => ({
                id: `tech-${tech.id}`,
                techId: tech.id,
                name: tech.name || tech.username,
                pronouns: getStaffPronouns(tech),
                isUnassigned: false
            }));

            const hasUnassigned = dayAppointments.some(apt => !apt.nailTech || !apt.nailTech.id);
            if (hasUnassigned || cols.length === 0) {
                cols.push({
                    id: 'tech-unassigned',
                    techId: null,
                    name: 'Anyone Available',
                    pronouns: 'Open Queue',
                    isUnassigned: true
                });
            }
            return cols;
        }, [staffList, dayAppointments]);

        const hourAxisTicks = useMemo(() => {
            const ticks = [];
            for (let hr = DEFAULT_OPEN_HOUR; hr <= DEFAULT_CLOSE_HOUR; hr++) {
                ticks.push({
                    hour24: hr,
                    label: formatMinutesToTimeLabel(hr * 60),
                    topPx: (hr - DEFAULT_OPEN_HOUR) * HOUR_ROW_HEIGHT_PX
                });
            }
            return ticks;
        }, []);

        const liveTimeIndicator = useMemo(() => {
            const currentMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
            const openMinutes = DEFAULT_OPEN_HOUR * 60;
            const closeMinutes = DEFAULT_CLOSE_HOUR * 60;
            const isWithinStoreHours = currentMinutes >= openMinutes && currentMinutes <= closeMinutes;
            const clampedMinutes = Math.max(openMinutes, Math.min(closeMinutes, currentMinutes));
            const elapsedMinutes = clampedMinutes - openMinutes;
            const topPx = (elapsedMinutes / 60) * HOUR_ROW_HEIGHT_PX;

            return {
                isWithinStoreHours,
                topPx,
                formattedTime: now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
            };
        }, [now]);

        const handleShiftDay = (delta) => {
            setSelectedDate(prev => {
                const next = new Date(prev);
                next.setDate(next.getDate() + delta);
                return next;
            });
        };

        const handleUpdateStatus = async (aptId, newStatus, reason = '') => {
            const url = `/api/appointments/${aptId}/status?status=${encodeURIComponent(newStatus)}${
                reason ? `&reason=${encodeURIComponent(reason)}` : ''
            }`;
            try {
                const res = await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'X-Tenant-ID': activeTenant,
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (res.ok) {
                    setSelectedAppointment(null);
                    setStatusReason('');
                    fetchScheduleData(true);
                } else {
                    alert('Failed to update appointment status.');
                }
            } catch (err) {
                console.error('Error updating status:', err);
            }
        };

        const handleColumnClick = (e, col) => {
            if (e.target.closest('.timeline-appt-block')) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const elapsedMins = (clickY / HOUR_ROW_HEIGHT_PX) * 60;
            const roundedMins = Math.round(elapsedMins / 15) * 15;
            const targetTotalMins = DEFAULT_OPEN_HOUR * 60 + roundedMins;
            const clampedTotalMins = Math.max(DEFAULT_OPEN_HOUR * 60, Math.min(DEFAULT_CLOSE_HOUR * 60 - 15, targetTotalMins));

            const hours24 = Math.floor(clampedTotalMins / 60);
            const mins = clampedTotalMins % 60;
            const timeStr = `${String(hours24).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

            setWalkInModal({
                isOpen: true,
                techId: col.isUnassigned ? null : col.techId,
                techName: col.name,
                isUnassigned: col.isUnassigned,
                date: selectedDateKey,
                time: timeStr,
                customerName: '',
                customerPhone: '',
                customerEmail: '',
                selectedServiceIds: servicesCatalog.length > 0 ? [servicesCatalog[0].id] : [],
                notes: '',
                saving: false,
                error: null
            });
        };

        const handleQuickFillWalkIn = () => {
            setWalkInModal(prev => ({
                ...prev,
                customerName: 'Walk-In Guest',
                customerPhone: '(555) 000-0000',
                customerEmail: 'walkin@salon.com',
                notes: 'Walk-in guest (Front desk entry)'
            }));
        };

        const handleToggleService = (srvId) => {
            setWalkInModal(prev => {
                const exists = prev.selectedServiceIds.includes(srvId);
                const next = exists
                    ? prev.selectedServiceIds.filter(id => id !== srvId)
                    : [...prev.selectedServiceIds, srvId];
                return { ...prev, selectedServiceIds: next };
            });
        };

        const walkInSelectedServices = useMemo(() => {
            return servicesCatalog.filter(s => walkInModal.selectedServiceIds.includes(s.id));
        }, [servicesCatalog, walkInModal.selectedServiceIds]);

        const walkInTotalCost = useMemo(() => {
            return walkInSelectedServices.reduce((sum, s) => sum + Number(s.price || 0), 0);
        }, [walkInSelectedServices]);

        const walkInTotalDuration = useMemo(() => {
            return walkInSelectedServices.reduce((sum, s) => sum + Number(s.durationMinutes || 45), 0);
        }, [walkInSelectedServices]);

        const handleSubmitWalkIn = async (e) => {
            if (e) e.preventDefault();
            if (!walkInModal.selectedServiceIds || walkInModal.selectedServiceIds.length === 0) {
                setWalkInModal(prev => ({ ...prev, error: 'Please select at least one service.' }));
                return;
            }

            setWalkInModal(prev => ({ ...prev, saving: true, error: null }));

            const custName = walkInModal.customerName.trim() || 'Walk-In Guest';
            const custPhone = walkInModal.customerPhone.trim() || '(555) 000-0000';
            const custEmail = walkInModal.customerEmail.trim() || 'walkin@salon.com';
            const appointmentTimeStr = `${walkInModal.date}T${walkInModal.time}:00`;

            const payload = {
                appointmentTime: appointmentTimeStr,
                customerName: custName,
                customerPhone: custPhone,
                customerEmail: custEmail,
                notes: walkInModal.notes ? walkInModal.notes.trim() : 'Walk-in manual booking',
                nailTech: walkInModal.techId ? { id: Number(walkInModal.techId) } : null,
                serviceIds: walkInModal.selectedServiceIds.map(Number),
                manualOverride: true
            };

            const headers = {
                'Content-Type': 'application/json',
                'X-Tenant-ID': activeTenant,
                ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            };

            try {
                const res = await fetch('/api/appointments', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || 'Failed to create walk-in appointment.');
                }

                setWalkInModal(prev => ({ ...prev, isOpen: false, saving: false }));
                await fetchScheduleData(true);
            } catch (err) {
                console.error('Walk-in booking error:', err);
                setWalkInModal(prev => ({ ...prev, saving: false, error: err.message || 'Error creating walk-in booking.' }));
            }
        };

        return h('div', { className: 'admin-timeline-wrapper border-0 overflow-hidden' },
            /* 1. Day & Date Header */
            h('div', { className: 'd-flex flex-wrap justify-content-between align-items-center gap-3 p-4 border-bottom' },
                h('div', { className: 'd-flex align-items-center gap-3' },
                    h('div', { className: 'calendar-date-badge d-flex flex-column align-items-center justify-content-center rounded-3' },
                        h('span', { className: 'month-abbr' }, selectedDate.toLocaleDateString('en-US', { month: 'short' }).toUpperCase()),
                        h('span', { className: 'day-num' }, selectedDate.getDate())
                    ),
                    h('div', null,
                        h('div', { className: 'd-flex align-items-center gap-2 flex-wrap' },
                            h('h2', { className: 'fw-bold text-dark mb-0 fs-4' }, formatFullDayHeader(selectedDate)),
                            isSelectedDateToday && h('span', { className: 'badge rounded-pill live-today-badge' }, 'Today • Live')
                        ),
                        h('p', { className: 'text-muted small mb-0 mt-1' },
                            `Daily Staff Timeline • Store Hours: 10:00 AM – 7:00 PM (${dayAppointments.length} booking${dayAppointments.length === 1 ? '' : 's'}) • Click empty slots to add Walk-In`
                        )
                    )
                ),
                h('div', { className: 'd-flex align-items-center gap-2 flex-wrap' },
                    h('div', { className: 'btn-group shadow-sm rounded-3', role: 'group' },
                        h('button', {
                            type: 'button',
                            className: 'btn btn-outline-secondary btn-sm px-3 fw-semibold',
                            onClick: () => handleShiftDay(-1)
                        }, '‹ Prev Day'),
                        h('button', {
                            type: 'button',
                            className: `btn btn-sm px-3 fw-semibold ${isSelectedDateToday ? 'btn-pink' : 'btn-outline-secondary'}`,
                            onClick: () => setSelectedDate(new Date())
                        }, 'Today'),
                        h('button', {
                            type: 'button',
                            className: 'btn btn-outline-secondary btn-sm px-3 fw-semibold',
                            onClick: () => handleShiftDay(1)
                        }, 'Next Day ›')
                    ),
                    h('input', {
                        type: 'date',
                        className: 'form-control form-control-sm timeline-date-picker',
                        value: selectedDateKey,
                        onChange: (e) => {
                            if (!e.target.value) return;
                            const [y, m, d] = e.target.value.split('-').map(Number);
                            if (y && m && d) setSelectedDate(new Date(y, m - 1, d));
                        }
                    })
                )
            ),

            /* Sunday Closed Notice */
            selectedDate.getDay() === 0 && h('div', { className: 'alert alert-warning border-0 rounded-0 m-0 px-4 py-2 small d-flex align-items-center gap-2' },
                h('i', { className: 'bi bi-info-circle-fill text-warning' }),
                h('span', null, 'Store is closed on Sundays. Operating hours: Monday – Saturday: 10:00 AM – 7:00 PM.')
            ),

            /* 2. Staff Column Timeline Grid */
            loading
                ? h('div', { className: 'text-center py-5' },
                    h('div', { className: 'spinner-border text-pink', role: 'status' }),
                    h('p', { className: 'text-muted mt-2 mb-0' }, 'Loading daily staff timeline...')

                : h('div', { className: 'timeline-scroll-container' },
                    h('div', {

                        h('div', { className: 'timeline-staff-header-row' },
                            h('div', { className: 'timeline-time-gutter-header' },
                                h('span', { className: 'small fw-bold text-uppercase text-muted' }, 'Time')
                            ),
                            staffColumns.map(col => {
                                const count = dayAppointments.filter(apt =>
                                    col.isUnassigned ? (!apt.nailTech || !apt.nailTech.id) : (apt.nailTech && apt.nailTech.id === col.techId)
                                ).length;

                                return h('div', { key: col.id, className: 'timeline-staff-col-header' },
                                    h('div', { className: 'd-flex align-items-center justify-content-center gap-2' },
                                        h('div', { className: 'staff-header-avatar' }, col.name.charAt(0).toUpperCase()),
                                        h('div', { className: 'text-start overflow-hidden' },
                                            h('div', { className: 'fw-bold text-dark text-truncate staff-header-name' }, col.name),
                                            h('div', { className: 'd-flex align-items-center gap-1' },
                                                h('span', { className: 'text-muted extra-small' }, col.pronouns),
                                                h('span', { className: 'badge rounded-pill bg-light text-secondary border extra-small' }, count)
                                            )
                                        )
                                    )
                                );
                            })
                        ),

                        /* Timeline Body */
                        h('div', { className: 'timeline-body-area', style: { height: `${totalGridHeightPx}px` } },
                            /* Left Time Axis */
                            h('div', { className: 'timeline-time-axis' },
                                hourAxisTicks.map(tick =>
                                    h('div', {
                                        key: tick.hour24,
                                        className: 'timeline-axis-tick',
                                        style: { top: `${tick.topPx}px` }
                                    }, h('span', { className: 'axis-time-text' }, tick.label))
                                )
                            ),

                            /* Columns Canvas */
                            h('div', { className: 'timeline-columns-canvas' },
                                hourAxisTicks.slice(0, -1).map(tick =>
                                    h(React.Fragment, { key: `grid-${tick.hour24}` },
                                        h('div', { className: 'timeline-hour-line', style: { top: `${tick.topPx}px` } }),
                                        h('div', { className: 'timeline-half-hour-line', style: { top: `${tick.topPx + HOUR_ROW_HEIGHT_PX / 2}px` } })
                                    )
                                ),
                                h('div', { className: 'timeline-hour-line', style: { top: `${totalGridHeightPx}px` } }),

                                /* Real-Time Dynamic Timeline Indicator (Active on Today) */
                                isSelectedDateToday && h('div', {
                                    className: `timeline-live-indicator ${!liveTimeIndicator.isWithinStoreHours ? 'outside-hours' : ''}`,
                                    style: { top: `${liveTimeIndicator.topPx}px` },
                                    title: `Current Time: ${liveTimeIndicator.formattedTime}`
                                },
                                    h('span', { className: 'live-indicator-time-pill' },
                                        h('span', { className: 'live-pulse-dot' }),
                                        liveTimeIndicator.formattedTime
                                    ),
                                    h('div', { className: 'live-indicator-line' })
                                ),

                                /* Staff Columns + Side-by-Side Positioned Appointment Blocks */
                                staffColumns.map(col => {
                                    const colAppts = dayAppointments.filter(apt =>
                                        col.isUnassigned ? (!apt.nailTech || !apt.nailTech.id) : (apt.nailTech && apt.nailTech.id === col.techId)
                                    );

                                    const layoutBlocks = computeStaffColumnLayout(colAppts, DEFAULT_OPEN_HOUR);

                                    return h('div', {
                                        key: col.id,
                                        className: 'timeline-staff-column',
                                        onClick: (e) => handleColumnClick(e, col),
                                        title: `Click empty slot on ${col.name}'s column to book walk-in`
                                    },
                                        layoutBlocks.map(item => {
                                            const { apt, topPx, heightPx, leftStyle, widthStyle, timeRangeLabel, isColliding } = item;
                                            const statusLower = String(apt.status || 'PENDING').toLowerCase();

                                            return h('div', {
                                                key: apt.id,
                                                className: `timeline-appt-block status-${statusLower} ${isColliding ? 'is-colliding' : ''}`,
                                                style: {
                                                    top: `${topPx}px`,
                                                    height: `${heightPx}px`,
                                                    left: leftStyle,
                                                    width: widthStyle
                                                },
                                                onClick: (e) => {
                                                    e.stopPropagation();
                                                    setSelectedAppointment(apt);
                                                },
                                                title: `${apt.customerName || 'Walk-In'} - ${(apt.service && apt.service.name) || 'Service'} (${timeRangeLabel})`
                                            },
                                                h('div', { className: 'd-flex justify-content-between align-items-start gap-1' },
                                                    h('span', { className: 'appt-time-badge' }, timeRangeLabel),
                                                    isColliding && h('span', { className: 'collision-badge', title: 'Side-by-side overlapping appointment' }, 'Overlap')
                                                ),
                                                h('div', { className: 'appt-customer-name text-truncate' }, apt.customerName || 'Walk-In Guest'),
                                                h('div', { className: 'appt-service-name text-truncate' }, (apt.service && apt.service.name) || 'Service')
                                            );
                                        })
                                    );
                                })
                            )
                        )
                    )
                  ),

            /* 3. Quick Walk-In / Manual Booking Modal */
            walkInModal.isOpen && h('div', {
                className: 'modal show d-block',
                tabIndex: '-1',
                style: { backgroundColor: 'rgba(15, 23, 42, 0.5)', zIndex: 1070 },
                onClick: () => setWalkInModal(prev => ({ ...prev, isOpen: false }))
            },
                h('div', {
                    className: 'modal-dialog modal-dialog-centered modal-lg',
                    onClick: (e) => e.stopPropagation()
                },
                    h('div', { className: 'modal-content border-0 shadow-lg rounded-4 overflow-hidden' },
                        h('div', { className: 'modal-header bg-light border-bottom py-3 px-4' },
                            h('div', null,
                                h('h5', { className: 'modal-title fw-bold text-dark mb-0' }, '⚡ Quick Walk-In / Manual Booking'),
                                h('p', { className: 'text-muted small mb-0 mt-1' },
                                    `Book directly for `,
                                    h('strong', null, walkInModal.techName),
                                    ` • ${walkInModal.date} at ${walkInModal.time}`
                                )
                            ),
                            h('button', {
                                type: 'button',
                                className: 'btn-close',
                                onClick: () => setWalkInModal(prev => ({ ...prev, isOpen: false }))
                            })
                        ),
                        h('div', { className: 'modal-body p-4' },
                            walkInModal.error && h('div', { className: 'alert alert-danger py-2 px-3 small rounded-3 mb-3' }, walkInModal.error),

                            /* Quick Fill Shortcut */
                            h('div', { className: 'd-flex justify-content-between align-items-center mb-3 p-2 rounded-3 bg-light border' },
                                h('span', { className: 'small text-muted fw-semibold' }, 'Need to seat an unannounced walk-in immediately?'),
                                h('button', {
                                    type: 'button',
                                    className: 'btn btn-outline-pink btn-sm fw-semibold',
                                    onClick: handleQuickFillWalkIn
                                }, '⚡ Quick Fill: Walk-In Guest')
                            ),

                            h('div', { className: 'row g-3' },
                                /* Assigned Tech */
                                h('div', { className: 'col-md-6' },
                                    h('label', { className: 'form-label small fw-bold text-secondary' }, 'Assigned Technician'),
                                    h('select', {
                                        className: 'form-select form-select-sm',
                                        value: walkInModal.techId ?? '',
                                        onChange: (e) => {
                                            const val = e.target.value ? Number(e.target.value) : null;
                                            const match = staffList.find(t => t.id === val);
                                            setWalkInModal(prev => ({
                                                ...prev,
                                                techId: val,
                                                techName: match ? (match.name || match.username) : 'Anyone Available'
                                            }));
                                        }
                                    },
                                        h('option', { value: '' }, 'Anyone Available (Open Queue)'),
                                        staffList.map(t =>
                                            h('option', { key: t.id, value: t.id }, `${t.name || t.username} (${getStaffPronouns(t)})`)
                                        )
                                    )
                                ),

                                /* Date & Time */
                                h('div', { className: 'col-md-3' },
                                    h('label', { className: 'form-label small fw-bold text-secondary' }, 'Date'),
                                    h('input', {
                                        type: 'date',
                                        className: 'form-control form-control-sm',
                                        value: walkInModal.date,
                                        onChange: (e) => setWalkInModal(prev => ({ ...prev, date: e.target.value }))
                                    })
                                ),
                                h('div', { className: 'col-md-3' },
                                    h('label', { className: 'form-label small fw-bold text-secondary' }, 'Start Time'),
                                    h('input', {
                                        type: 'time',
                                        className: 'form-control form-control-sm',
                                        value: walkInModal.time,
                                        onChange: (e) => setWalkInModal(prev => ({ ...prev, time: e.target.value }))
                                    })
                                ),

                                /* Customer Info */
                                h('div', { className: 'col-md-4' },
                                    h('label', { className: 'form-label small fw-bold text-secondary' },
                                        'Customer Name ', h('span', { className: 'text-danger' }, '*')
                                    ),
                                    h('input', {
                                        type: 'text',
                                        className: 'form-control form-control-sm',
                                        placeholder: 'e.g. Walk-In Guest or Jane Doe',
                                        value: walkInModal.customerName,
                                        onChange: (e) => setWalkInModal(prev => ({ ...prev, customerName: e.target.value }))
                                    })
                                ),
                                h('div', { className: 'col-md-4' },
                                    h('label', { className: 'form-label small fw-bold text-secondary' }, 'Phone Number'),
                                    h('input', {
                                        type: 'tel',
                                        className: 'form-control form-control-sm',
                                        placeholder: '(555) 000-0000',
                                        value: walkInModal.customerPhone,
                                        onChange: (e) => setWalkInModal(prev => ({ ...prev, customerPhone: e.target.value }))
                                    })
                                ),
                                h('div', { className: 'col-md-4' },
                                    h('label', { className: 'form-label small fw-bold text-secondary' }, 'Email Address'),
                                    h('input', {
                                        type: 'email',
                                        className: 'form-control form-control-sm',
                                        placeholder: 'walkin@salon.com',
                                        value: walkInModal.customerEmail,
                                        onChange: (e) => setWalkInModal(prev => ({ ...prev, customerEmail: e.target.value }))
                                    })
                                ),

                                /* Service Selection */
                                h('div', { className: 'col-12' },
                                    h('div', { className: 'd-flex justify-content-between align-items-center mb-2' },
                                        h('label', { className: 'form-label small fw-bold text-secondary mb-0' },
                                            'Select Service(s) ', h('span', { className: 'text-danger' }, '*')
                                        ),
                                        h('span', { className: 'badge bg-light text-dark border' },
                                            `${walkInSelectedServices.length} Selected • $${walkInTotalCost.toFixed(2)} • ${walkInTotalDuration} mins`
                                        )
                                    ),
                                    h('div', { className: 'walkin-service-catalog border rounded-3 p-2 bg-light' },
                                        servicesCatalog.length === 0
                                            ? h('p', { className: 'text-muted small mb-0 p-2' }, 'Loading service catalog...')
                                            : h('div', { className: 'row g-2' },
                                                servicesCatalog.map(srv => {
                                                    const isChecked = walkInModal.selectedServiceIds.includes(srv.id);
                                                    return h('div', { key: srv.id, className: 'col-md-6 col-lg-4' },
                                                        h('div', {
                                                            className: `service-select-card p-2 rounded-2 border d-flex align-items-center gap-2 ${isChecked ? 'selected bg-white border-pink shadow-sm' : 'bg-white'}`,
                                                            onClick: () => handleToggleService(srv.id)
                                                        },
                                                            h('input', {
                                                                type: 'checkbox',
                                                                className: 'form-check-input mt-0',
                                                                checked: isChecked,
                                                                onChange: () => handleToggleService(srv.id),
                                                                onClick: (e) => e.stopPropagation()
                                                            }),
                                                            h('div', { className: 'overflow-hidden flex-grow-1' },
                                                                h('div', { className: 'fw-semibold small text-truncate text-dark' }, srv.name),
                                                                h('div', { className: 'text-muted extra-small' },
                                                                    `$${Number(srv.price || 0).toFixed(2)} • ${srv.durationMinutes || 45} mins`
                                                                )
                                                            )
                                                        )
                                                    );
                                                })
                                              )
                                    )
                                ),

                                /* Notes */
                                h('div', { className: 'col-12' },
                                    h('label', { className: 'form-label small fw-bold text-secondary' }, 'Notes / Station Request'),
                                    h('input', {
                                        type: 'text',
                                        className: 'form-control form-control-sm',
                                        placeholder: 'e.g. Station 2, prefers quiet technician, color request',
                                        value: walkInModal.notes,
                                        onChange: (e) => setWalkInModal(prev => ({ ...prev, notes: e.target.value }))
                                    })
                                )
                            )
                        ),
                        h('div', { className: 'modal-footer bg-light border-top d-flex justify-content-between' },
                            h('button', {
                                type: 'button',
                                className: 'btn btn-sm btn-outline-secondary px-3',
                                onClick: () => setWalkInModal(prev => ({ ...prev, isOpen: false })),
                                disabled: walkInModal.saving
                            }, 'Cancel'),
                            h('button', {
                                type: 'button',
                                className: 'btn btn-sm btn-pink text-white fw-semibold px-4',
                                onClick: handleSubmitWalkIn,
                                disabled: walkInModal.saving
                            }, walkInModal.saving ? 'Saving Walk-In...' : '⚡ Confirm & Save Booking')
                        )
                    )
                )
            ),

            /* 4. Appointment Details Modal */
            selectedAppointment && h('div', {
                className: 'modal show d-block',
                tabIndex: '-1',
                style: { backgroundColor: 'rgba(15, 23, 42, 0.45)', zIndex: 1060 },
                onClick: () => setSelectedAppointment(null)
            },
                h('div', {
                    className: 'modal-dialog modal-dialog-centered',
                    onClick: (e) => e.stopPropagation()
                },
                    h('div', { className: 'modal-content border-0 shadow-lg rounded-4' },
                        h('div', { className: 'modal-header border-bottom' },
                            h('h5', { className: 'modal-title fw-bold text-dark' },
                                h('i', { className: 'bi bi-info-circle text-pink me-2' }),
                                'Booking Details'
                            ),
                            h('button', {
                                type: 'button',
                                className: 'btn-close',
                                onClick: () => setSelectedAppointment(null)
                            })
                        ),
                        h('div', { className: 'modal-body p-4' },
                            h('p', { className: 'mb-2' }, h('strong', null, 'Customer Name: '), selectedAppointment.customerName || 'N/A'),
                            h('p', { className: 'mb-2' }, h('strong', null, 'Phone Number: '), selectedAppointment.customerPhone || 'N/A'),
                            h('p', { className: 'mb-2' }, h('strong', null, 'Email: '), selectedAppointment.customerEmail || 'N/A'),
                            h('p', { className: 'mb-2' }, h('strong', null, 'Service: '), (selectedAppointment.service && selectedAppointment.service.name) || 'Service'),
                            h('p', { className: 'mb-2' }, h('strong', null, 'Nail Technician: '), (selectedAppointment.nailTech && (selectedAppointment.nailTech.name || selectedAppointment.nailTech.username)) || 'Anyone Available'),
                            selectedAppointment.stationPreference && h('p', { className: 'mb-2' }, h('strong', null, 'Station / Suite: '), selectedAppointment.stationPreference),
                            h('p', { className: 'mb-2' }, h('strong', null, 'Time: '), new Date(selectedAppointment.appointmentTime).toLocaleString()),
                            selectedAppointment.notes && h('p', { className: 'mb-2' }, h('strong', null, 'Notes: '), selectedAppointment.notes),
                            h('p', { className: 'mb-3' }, h('strong', null, 'Status: '), h('span', { className: 'badge bg-secondary' }, selectedAppointment.status || 'PENDING')),

                            /* Audit note / Reason input */
                            h('div', { className: 'p-3 bg-light rounded-3 border' },
                                h('label', { className: 'form-label small fw-bold text-secondary mb-1' }, 'Cancellation / No-Show Reason (Audit Log Note):'),
                                h('input', {
                                    type: 'text',
                                    className: 'form-control form-control-sm',
                                    placeholder: 'e.g. Client unwell, Late cancellation, No call no show',
                                    value: statusReason,
                                    onChange: (e) => setStatusReason(e.target.value)
                                }),
                                h('div', { className: 'd-flex gap-1 mt-2' },
                                    ['Late Cancel', 'Sick / Emergency', 'No Call / No Show'].map(preset =>
                                        h('button', {
                                            key: preset,
                                            type: 'button',
                                            className: 'btn btn-outline-secondary btn-sm py-0 px-2',
                                            style: { fontSize: '0.72rem' },
                                            onClick: () => setStatusReason(preset)
                                        }, preset)
                                    )
                                )
                            )
                        ),
                        h('div', { className: 'modal-footer d-flex justify-content-between' },
                            h('div', { className: 'd-flex gap-2 flex-wrap' },
                                h('button', {
                                    className: 'btn btn-sm btn-outline-success fw-semibold',
                                    onClick: () => handleUpdateStatus(selectedAppointment.id, 'CONFIRMED')
                                }, 'Confirm'),
                                h('button', {
                                    className: 'btn btn-sm btn-outline-danger fw-semibold',
                                    onClick: () => handleUpdateStatus(selectedAppointment.id, 'CANCELLED', statusReason)
                                }, 'Cancel'),
                                h('button', {
                                    className: 'btn btn-sm btn-outline-warning text-dark fw-semibold',
                                    onClick: () => handleUpdateStatus(selectedAppointment.id, 'NO_SHOW', statusReason)
                                }, 'Mark No-Show')
                            ),
                            h('button', {
                                type: 'button',
                                className: 'btn btn-sm btn-secondary',
                                onClick: () => {
                                    setSelectedAppointment(null);
                                    setStatusReason('');
                                }
                            }, 'Close')
                        )
                    )
                )
            )
        );
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadBranding();
        const rootEl = document.getElementById('adminTimelineRoot');
        if (rootEl && window.ReactDOM) {
            const root = ReactDOM.createRoot(rootEl);
            root.render(React.createElement(AdminDailyTimelineCalendar));
        }
    });
</script>
</body>
</html>
