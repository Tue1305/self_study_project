<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Jenny's Nail Studio</title>
    <!-- Favicon Tag -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }

        /* Input focus outline */
        .form-control:focus {
            border-color: #f48fb1;
            box-shadow: 0 0 0 0.25rem rgba(233, 30, 99, 0.25);
        }

        /* Card Hover Effect */
        .signup-card {
            transition: box-shadow 0.25s ease;
        }
        .signup-card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1) !important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">

<!-- Container wrapper for card width -->
<div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 signup-card">

        <!-- Logo Header -->
        <div class="text-center mb-4">
            <a href="/" class="fw-bold text-pink fs-3 text-decoration-none d-inline-block mb-1">
                Jenny's Nail Studio
            </a>
            <h1 class="h4 fw-bold text-dark mb-0">Create Your Account</h1>
        </div>

        <!-- Dynamic Selected Plan Badge -->
        <div id="planDisplay" class="badge bg-danger-subtle text-pink border border-danger-subtle rounded-3 p-3 w-100 mb-4 text-wrap fs-6 fw-semibold" style="display: none;"></div>

        <!-- Sign Up Form -->
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary fw-semibold small">Username</label>
                <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0">
                            <i class="bi bi-person"></i>
                        </span>
                    <input type="text" id="username" class="form-control border-start-0 ps-0" required autocomplete="username" placeholder="Choose a username">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold small">Password</label>
                <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                    <input type="password" id="password" class="form-control border-start-0 ps-0" required autocomplete="new-password" placeholder="Create a password">
                </div>
            </div>

            <button type="submit" class="btn btn-pink w-100 rounded-3 py-2 fw-semibold fs-6 shadow-sm">
                Sign Up &amp; Continue <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <!-- Error Feedback Message -->
        <p id="errorMsg" class="text-danger text-center small mt-3 mb-0 fw-semibold"></p>

        <!-- Card Footer -->
        <div class="text-center border-top mt-4 pt-3 text-muted small">
            Already have an account?
            <a href="./login.html" class="text-pink fw-semibold text-decoration-none ms-1">Log In</a>
        </div>

    </div>
</div>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Display selected plan if coming from subscription page
    const selectedPlan = localStorage.getItem('selectedPlan');
    if (selectedPlan) {
        const badge = document.getElementById('planDisplay');
        badge.innerHTML = `<i class="bi bi-stars me-1"></i> Selected Subscription: <strong>${selectedPlan}</strong>`;
        badge.style.display = 'block';
    }

    async function handleSignup(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.innerText = '';

        try {
            // 1. Send registration request (or authenticate directly depending on backend)
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                // 2. Perform auto-login after successful registration to get JWT
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (loginRes.ok) {
                    const data = await loginRes.json();
                    localStorage.setItem('accessToken', data.accessToken);
                    window.location.href = './dashboard.html';
                } else {
                    window.location.href = './login.html';
                }
            } else {
                const text = await response.text();
                errorMsg.innerText = text || 'Registration failed. Username may be taken.';
            }
        } catch (err) {
            errorMsg.innerText = 'Unable to connect to the server.';
        }
    }
</script>
</body>
</html>
