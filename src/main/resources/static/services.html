<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services & Pricing - Jenny's Nail Studio</title>
    <!-- Favicon Tag -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }
        .user-badge-link {
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .user-badge-link:hover {
            transform: translateY(-1px);
            background-color: #f8d7da !important;
            box-shadow: 0 2px 5px rgba(233, 30, 99, 0.15);
        }
        .service-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .service-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12) !important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navigation Header -->
<header class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 px-lg-4">
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-3">
            <a href="./index.html" class="navbar-brand fw-bold text-pink fs-4 mb-0">Jenny's Nail Studio</a>
            <a href="./profile.html"
               id="userBadge"
               class="badge bg-danger-subtle text-pink border border-danger-subtle rounded-pill px-3 py-2 fs-6 d-none align-items-center gap-1 user-badge-link"
               title="Click to view and edit profile settings">
                <i class="bi bi-person-fill"></i>
                <span id="usernameDisplay">Client</span>
            </a>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 pt-3 pt-lg-0" id="authNav">
                <!-- Injected dynamically via JavaScript -->
            </div>
        </div>
    </div>
</header>

<!-- Main Content Container -->
<main class="container my-5 flex-grow-1">
    <div class="text-center mb-5">
        <h1 class="display-6 fw-bold text-dark mb-2">Studio Services &amp; Pricing</h1>
        <p class="lead text-muted mx-auto" style="max-width: 650px;">Choose from our signature manicures, custom sculpting extensions, and luxury pedicure treatments.</p>

        <!-- Admin Controls (Only visible when logged in as ROLE_ADMIN) -->
        <div id="adminServiceControls" class="d-none mt-3">
            <button class="btn btn-pink rounded-pill px-4 py-2 fw-semibold shadow-sm" onclick="openAddServiceModal()">
                <i class="bi bi-plus-circle me-1"></i> Add New Service
            </button>
        </div>
    </div>

    <!-- Services Grid -->
    <div class="row row-cols-1 row-cols-md-2 g-4" id="servicesGrid">
        <!-- Populated dynamically from /api/services -->
    </div>
</main>

<!-- Admin Add/Edit Service Modal -->
<div class="modal fade" id="serviceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark" id="serviceModalTitle">Add New Service</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body py-4">
                <form id="serviceForm">
                    <input type="hidden" id="serviceId">
                    <div class="mb-3">
                        <label for="serviceName" class="form-label fw-semibold">Service Name</label>
                        <input type="text" class="form-control" id="serviceName" required placeholder="e.g., Gel Manicure">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="servicePrice" class="form-label fw-semibold">Price ($)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="servicePrice" required placeholder="45.00">
                        </div>
                        <div class="col-6">
                            <label for="serviceDuration" class="form-label fw-semibold">Duration (Minutes)</label>
                            <input type="number" min="5" step="5" class="form-control" id="serviceDuration" required placeholder="45">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="serviceDescription" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="serviceDescription" rows="3" placeholder="Describe what is included in this service..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-pink btn-sm px-4 fw-semibold" onclick="saveService()">Save Service</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Custom Nail Sculpting &amp; Artistry</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let isAdminUser = false;
    let servicesCache = [];
    let serviceModalInstance = null;

    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            const payload = JSON.parse(jsonPayload);
            if (payload.exp && Date.now() >= payload.exp * 1000) {
                return null;
            }
            return payload;
        } catch (e) {
            return null;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        serviceModalInstance = new bootstrap.Modal(document.getElementById('serviceModal'));

        const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
        const username = localStorage.getItem('username');

        const authNav = document.getElementById('authNav');
        const userBadge = document.getElementById('userBadge');
        const usernameDisplay = document.getElementById('usernameDisplay');

        const decodedToken = token ? parseJwt(token) : null;

        if (token && decodedToken) {
            const activeUser = username || decodedToken.sub || decodedToken.username || 'Client';
            const role = decodedToken.role || decodedToken.authorities || (decodedToken.roles ? decodedToken.roles[0] : 'ROLE_USER');
            isAdminUser = (role === 'ROLE_ADMIN' || role === 'ADMIN');

            if (userBadge && usernameDisplay) {
                usernameDisplay.textContent = activeUser;
                userBadge.classList.remove('d-none');
                userBadge.classList.add('d-inline-flex');
            }

            let adminLinkHtml = '';
            if (isAdminUser) {
                adminLinkHtml = `<a href="./admin-dashboard.html" class="nav-link fw-bold text-danger"><i class="bi bi-shield-lock-fill me-1"></i>Admin Portal</a>`;
                document.getElementById('adminServiceControls').classList.remove('d-none');
            }

            if (authNav) {
                authNav.innerHTML = `
                    <a href="./index.html" class="nav-link fw-semibold text-dark">Home</a>
                    <a href="./dashboard.html" class="nav-link fw-semibold text-dark">Showcase</a>
                    <a href="./products.html" class="nav-link fw-semibold text-dark">Products</a>
                    <a href="./services.html" class="nav-link fw-semibold text-pink active">Services</a>
                    <a href="./booking.html" class="nav-link fw-semibold text-dark">Book Now</a>
                    ${adminLinkHtml}
                    <a href="./profile.html" class="nav-link fw-semibold text-dark">Profile</a>
                    <a href="#" onclick="handleLogout()" class="nav-link fw-semibold text-dark">Logout</a>
                    <a href="./subscription-plans.html" class="btn btn-pink rounded-pill px-4 py-2 fw-semibold">Subscription Plans</a>
                `;
            }
        } else {
            if (token) {
                localStorage.removeItem('accessToken');
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                localStorage.removeItem('userRole');
            }

            if (userBadge) {
                userBadge.classList.add('d-none');
                userBadge.classList.remove('d-inline-flex');
            }

            if (authNav) {
                authNav.innerHTML = `
                    <a href="./index.html" class="nav-link fw-semibold text-dark">Home</a>
                    <a href="./dashboard.html" class="nav-link fw-semibold text-dark">Showcase</a>
                    <a href="./products.html" class="nav-link fw-semibold text-dark">Products</a>
                    <a href="./services.html" class="nav-link fw-semibold text-pink active">Services</a>
                    <a href="./booking.html" class="nav-link fw-semibold text-dark">Book Now</a>
                    <a href="./login.html" class="nav-link fw-semibold text-dark">Log in</a>
                    <a href="./signup.html" class="nav-link fw-semibold text-dark">Sign up</a>
                    <a href="./subscription-plans.html" class="btn btn-pink rounded-pill px-4 py-2 fw-semibold">Subscription Plans</a>
                `;
            }
        }

        loadServices();
    });

    async function loadServices() {
        const grid = document.getElementById('servicesGrid');
        try {
            const response = await fetch('/api/services');
            if (!response.ok) throw new Error('Failed to load services');
            servicesCache = await response.json();
            renderServices();
        } catch (err) {
            console.error('Error loading services:', err);
            grid.innerHTML = `<div class="col-12 text-center text-muted py-5">Unable to load services right now.</div>`;
        }
    }

    function renderServices() {
        const grid = document.getElementById('servicesGrid');
        grid.innerHTML = '';

        if (servicesCache.length === 0) {
            grid.innerHTML = `<div class="col-12 text-center text-muted py-5">No services available yet.</div>`;
            return;
        }

        servicesCache.forEach(service => {
            const priceFormatted = Number(service.price || 0).toFixed(2);
            const duration = service.durationMinutes || 60;
            const safeName = (service.name || '').replace(/'/g, "\\'");

            const adminButtons = isAdminUser ? `
                <div class="ms-2 d-inline-flex gap-1">
                    <button class="btn btn-outline-secondary btn-sm" title="Edit Service" onclick="openEditServiceModal(${service.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-outline-danger btn-sm" title="Delete Service" onclick="deleteService(${service.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            ` : '';

            grid.innerHTML += `
                <div class="col">
                    <div class="card h-100 border-0 shadow-sm rounded-4 p-4 service-card d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h3 class="h4 fw-bold text-dark mb-0">${service.name}</h3>
                                <div class="d-flex align-items-center">
                                    <span class="fs-4 fw-bold text-pink">$${priceFormatted}</span>
                                    ${adminButtons}
                                </div>
                            </div>
                            <span class="badge bg-light text-secondary border rounded-pill px-3 py-1 mb-3">
                                <i class="bi bi-clock me-1"></i> ${duration} mins
                            </span>
                            <p class="text-muted mb-4">${service.description || ''}</p>
                        </div>
                        <button class="btn btn-pink rounded-pill py-2 fw-semibold w-100" onclick="bookService('${safeName}')">
                            <i class="bi bi-calendar-check me-1"></i> Book This Service
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function bookService(serviceName) {
        localStorage.setItem('selectedDesign', serviceName);
        window.location.href = './booking.html';
    }

    function openAddServiceModal() {
        document.getElementById('serviceId').value = '';
        document.getElementById('serviceName').value = '';
        document.getElementById('servicePrice').value = '';
        document.getElementById('serviceDuration').value = '60';
        document.getElementById('serviceDescription').value = '';
        document.getElementById('serviceModalTitle').innerText = 'Add New Service';
        serviceModalInstance.show();
    }

    function openEditServiceModal(id) {
        const service = servicesCache.find(s => s.id === id);
        if (!service) return;

        document.getElementById('serviceId').value = service.id;
        document.getElementById('serviceName').value = service.name || '';
        document.getElementById('servicePrice').value = service.price || '';
        document.getElementById('serviceDuration').value = service.durationMinutes || 60;
        document.getElementById('serviceDescription').value = service.description || '';
        document.getElementById('serviceModalTitle').innerText = 'Edit Service';
        serviceModalInstance.show();
    }

    async function saveService() {
        const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
        const id = document.getElementById('serviceId').value;
        const name = document.getElementById('serviceName').value.trim();
        const price = parseFloat(document.getElementById('servicePrice').value);
        const durationMinutes = parseInt(document.getElementById('serviceDuration').value) || 60;
        const description = document.getElementById('serviceDescription').value.trim();

        if (!name || isNaN(price)) {
            alert('Please enter a valid Service Name and Price.');
            return;
        }

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/services/${id}` : '/api/services';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ name, price, durationMinutes, description })
            });

            if (response.ok) {
                if (document.activeElement) document.activeElement.blur();
                serviceModalInstance.hide();
                loadServices();
            } else {
                const text = await response.text();
                alert('Failed to save service: ' + (text || response.statusText));
            }
        } catch (err) {
            console.error('Error saving service:', err);
            alert('Server connection error.');
        }
    }

    async function deleteService(id) {
        if (!confirm('Are you sure you want to delete this service?')) return;
        const token = localStorage.getItem('accessToken') || localStorage.getItem('token');

        try {
            const response = await fetch(`/api/services/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                loadServices();
            } else {
                alert('Failed to delete service.');
            }
        } catch (err) {
            console.error('Error deleting service:', err);
            alert('Server connection error.');
        }
    }

    function handleLogout() {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('userRole');
        window.location.href = './login.html';
    }
</script>
</body>
</html>
