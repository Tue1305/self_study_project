<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Jenny's Nail Studio</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }
        .teaser-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .teaser-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12) !important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 teaser-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill text-pink fs-1"></i>
                        <h2 class="text-pink fw-bold mt-2">Reset Password</h2>
                        <p class="text-muted small">Enter your email address and we'll send you instructions to reset your password.</p>
                    </div>

                    <div id="successMessage" class="alert alert-success d-none text-center" role="alert">
                        📩 If an account exists with this email, a password reset link has been sent.
                    </div>

                    <div id="errorMessage" class="alert alert-danger d-none text-center" role="alert">
                        ⚠️ Unable to process request. Please try again later.
                    </div>

                    <form id="forgotPasswordForm">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" required placeholder="jane@example.com">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-pink w-100 btn-lg rounded-3 fw-bold mb-3">Send Reset Link</button>
                    </form>

                    <div class="text-center">
                        <a href="./login.html" class="text-decoration-none text-pink small fw-semibold">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const successAlert = document.getElementById('successMessage');
        const errorAlert = document.getElementById('errorMessage');

        successAlert.classList.add('d-none');
        errorAlert.classList.add('d-none');

        try {
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            if (response.ok) {
                successAlert.classList.remove('d-none');
                document.getElementById('forgotPasswordForm').reset();
            } else {
                errorAlert.classList.remove('d-none');
            }
        } catch (err) {
            console.error('Error submitting forgot password:', err);
            errorAlert.classList.remove('d-none');
        }
    });
</script>

</body>
</html>
