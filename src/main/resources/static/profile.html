<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Jenny's Nail Studio</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }

        /* Avatar Styling */
        .avatar-circle {
            width: 70px;
            height: 70px;
            font-size: 2rem;
        }

        /* Subscription Banner Gradient & Border */
        .sub-box {
            background: linear-gradient(135deg, #fff0f5 0%, #ffffff 100%);
            border: 2px solid #f8bbd0;
        }

        /* Profile Card Hover Effect */
        .profile-card {
            transition: box-shadow 0.25s ease;
        }
        .profile-card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08) !important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navigation Header -->
<header class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 px-lg-4">
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-3">
            <a href="/" class="navbar-brand fw-bold text-pink fs-4 mb-0">Jenny's Nail Studio</a>
            <div class="badge bg-danger-subtle text-pink border border-danger-subtle rounded-pill px-3 py-2 fs-6 d-inline-flex align-items-center gap-1" id="userBadge">
                <i class="bi bi-person-fill"></i>
                <span id="usernameDisplay">Client</span>
            </div>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 pt-3 pt-lg-0">
                <a href="/dashboard.html" class="nav-link fw-semibold text-dark">Showcase</a>
                <a href="/services.html" class="nav-link fw-semibold text-dark">Services</a>
                <a href="/subscription-plans.html" class="nav-link fw-semibold text-dark">Subscriptions</a>
                <a href="/profile.html" class="nav-link fw-semibold text-pink active">Profile</a>
                <a href="#" onclick="handleLogout()" class="btn btn-outline-pink rounded-pill px-3 py-1 btn-sm ms-lg-2">Logout</a>
            </div>
        </div>
    </div>
</header>

<!-- Main Content Container -->
<main class="container my-5 flex-grow-1" style="max-width: 800px;">

    <!-- Profile Summary Header -->
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 profile-card">
        <div class="d-flex align-items-center gap-3">
            <div class="avatar-circle bg-danger-subtle text-pink rounded-circle fw-bold d-flex align-items-center justify-content-center flex-shrink-0" id="avatarLetter">
                U
            </div>
            <div>
                <h1 class="h4 fw-bold text-dark mb-1" id="profileHeaderName">Loading...</h1>
                <span class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1 rounded-pill text-uppercase" id="profileRole">CLIENT</span>
            </div>
        </div>
    </div>

    <!-- Feedback Alerts -->
    <div id="alertContainer"></div>

    <!-- Account Details Form -->
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 profile-card">
        <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-person-gear text-pink me-2"></i>Account Details</h2>
        <form id="profileForm" onsubmit="handleUpdateProfile(event)">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="usernameInput" class="form-label fw-semibold text-muted small">Username</label>
                    <input type="text" class="form-control rounded-3" id="usernameInput" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="emailInput" class="form-label fw-semibold text-muted small">Email Address</label>
                    <input type="email" class="form-control rounded-3" id="emailInput" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="phoneInput" class="form-label fw-semibold text-muted small">Phone Number</label>
                    <input type="tel" class="form-control rounded-3" id="phoneInput" placeholder="(555) 000-0000">
                </div>
            </div>
            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-pink rounded-pill px-4 fw-semibold">Save Profile Changes</button>
            </div>
        </form>
    </div>

    <!-- Security & Password Adjustment Form -->
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 profile-card">
        <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-shield-lock text-pink me-2"></i>Security &amp; Password</h2>
        <form id="passwordForm" onsubmit="handleChangePassword(event)">
            <div class="row g-3">
                <div class="col-12">
                    <label for="currentPassword" class="form-label fw-semibold text-muted small">Current Password</label>
                    <input type="password" class="form-control rounded-3" id="currentPassword" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="newPassword" class="form-label fw-semibold text-muted small">New Password</label>
                    <input type="password" class="form-control rounded-3" id="newPassword" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="confirmPassword" class="form-label fw-semibold text-muted small">Confirm New Password</label>
                    <input type="password" class="form-control rounded-3" id="confirmPassword" required>
                </div>
            </div>
            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-outline-pink rounded-pill px-4 fw-semibold">Update Password</button>
            </div>
        </form>
    </div>

    <!-- Active Subscription Management Card -->
    <div class="card border-0 shadow-sm rounded-4 p-4 profile-card">
        <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-credit-card-2-front text-pink me-2"></i>Membership &amp; Subscriptions</h2>
        <div class="sub-box rounded-4 p-4 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
            <div>
                <span class="text-muted text-uppercase fw-semibold fs-7 d-block mb-1" style="letter-spacing: 0.5px;">Current Tier</span>
                <div class="fs-4 fw-bold text-pink mb-2" id="subPlanName">Loading...</div>
                <span id="subStatusBadge" class="badge bg-danger-subtle text-danger fw-bold rounded-pill px-3 py-2">INACTIVE</span>
            </div>
            <a href="/subscription-plans.html" class="btn btn-pink rounded-pill px-4 py-2 fw-semibold align-self-start align-self-sm-center">
                Manage / Upgrade Plan
            </a>
        </div>
    </div>

</main>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Custom Nail Sculpting &amp; Artistry</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) {
        window.location.href = '/login.html';
    }

    function showAlert(message, type = 'success') {
        const alertContainer = document.getElementById('alertContainer');
        alertContainer.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show rounded-3" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
    }

    async function loadUserProfile() {
        try {
            // Fetch account details
            const userResponse = await fetch('/api/users/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            const storedUser = localStorage.getItem('username') || 'Client';

            if (userResponse.ok) {
                const userData = await userResponse.json();
                document.getElementById('usernameInput').value = userData.username || storedUser;
                document.getElementById('emailInput').value = userData.email || '';
                document.getElementById('phoneInput').value = userData.phoneNumber || '';

                document.getElementById('profileHeaderName').textContent = userData.username || storedUser;
                document.getElementById('usernameDisplay').textContent = userData.username || storedUser;
                document.getElementById('avatarLetter').textContent = (userData.username || storedUser).charAt(0).toUpperCase();
            } else {
                // Fallback to local storage if user endpoint isn't fully set up yet
                document.getElementById('profileHeaderName').textContent = storedUser;
                document.getElementById('usernameDisplay').textContent = storedUser;
                document.getElementById('usernameInput').value = storedUser;
                document.getElementById('avatarLetter').textContent = storedUser.charAt(0).toUpperCase();
            }

            // Fetch Subscription status
            const subResponse = await fetch('/api/subscriptions/current', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (subResponse.ok) {
                const subData = await subResponse.json();
                const plan = subData.subscriptionPlan || 'None';
                const status = subData.subscriptionStatus || 'INACTIVE';

                document.getElementById('subPlanName').textContent = plan;
                const badge = document.getElementById('subStatusBadge');
                badge.textContent = status;

                if (status === 'ACTIVE') {
                    badge.className = 'badge bg-success-subtle text-success fw-bold rounded-pill px-3 py-2';
                } else {
                    badge.className = 'badge bg-danger-subtle text-danger fw-bold rounded-pill px-3 py-2';
                }
            }
        } catch (err) {
            console.error('Error loading profile:', err);
        }
    }

    async function handleUpdateProfile(event) {
        event.preventDefault();
        const username = document.getElementById('usernameInput').value;
        const email = document.getElementById('emailInput').value;
        const phoneNumber = document.getElementById('phoneInput').value;

        try {
            const response = await fetch('/api/users/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ username, email, phoneNumber })
            });

            if (response.ok) {
                localStorage.setItem('username', username);
                showAlert('Profile updated successfully!');
                loadUserProfile();
            } else {
                showAlert('Failed to update profile details.', 'danger');
            }
        } catch (err) {
            console.error(err);
            showAlert('An error occurred while updating profile.', 'danger');
        }
    }

    async function handleChangePassword(event) {
        event.preventDefault();
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            showAlert('New passwords do not match.', 'warning');
            return;
        }

        try {
            const response = await fetch('/api/users/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ currentPassword, newPassword })
            });

            if (response.ok) {
                showAlert('Password changed successfully!');
                document.getElementById('passwordForm').reset();
            } else {
                showAlert('Failed to change password. Please check your current password.', 'danger');
            }
        } catch (err) {
            console.error(err);
            showAlert('An error occurred while changing password.', 'danger');
        }
    }

    function handleLogout() {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('username');
        window.location.href = '/login.html';
    }

    loadUserProfile();
</script>
</body>
</html>
