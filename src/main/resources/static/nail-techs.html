<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Nail Techs - Jenny's Nail Studio</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?=v2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bs-primary-pink: #e91e63; }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .btn-outline-pink { color: var(--bs-primary-pink); border-color: var(--bs-primary-pink); }
        .btn-outline-pink:hover { background-color: var(--bs-primary-pink); color: #fff; }
        .btn-pink { background-color: var(--bs-primary-pink); color: #fff; }
        .btn-pink:hover { background-color: #d81b60; color: #fff; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Unified Header Navigation -->
<header class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold text-dark fs-5">
            <i class="bi bi-shield-lock-fill text-pink me-2"></i>Jenny's Admin Portal
        </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                <li class="nav-item">
                    <a class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark me-1" href="./admin-portal.html">
                        <i class="bi bi-house-door me-1"></i> Portal
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark me-1" href="./admin-dashboard.html">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark me-1" href="./admin-calendar.html">
                        <i class="bi bi-calendar-week me-1"></i> Calendar
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-pink btn-sm px-3 fw-semibold text-white me-1" href="./admin-nailtech.html">
                        <i class="bi bi-people me-1"></i> Nail Techs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark" href="./admin-subs.html">
                        <i class="bi bi-star me-1"></i> Subscribers
                    </a>
                </li>
            </ul>
            <button class="btn btn-outline-pink btn-sm fw-semibold ms-auto" onclick="handleLogout()">
                <i class="bi bi-box-arrow-right me-1"></i> Log Out
            </button>
        </div>
    </div>
</header>

<!-- Main Container -->
<main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 fw-bold text-dark mb-0">
            <i class="bi bi-people-fill text-pink me-2"></i>Manage Nail Technicians
        </h2>
        <button class="btn btn-pink btn-sm fw-semibold" onclick="openAddModal()">
            <i class="bi bi-plus-lg me-1"></i> Add Nail Tech
        </button>
    </div>

    <!-- Nail Tech Table Card -->
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email / Username</th>
                    <th>Specialty</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="techTableBody">
                <!-- Populated dynamically via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Add/Edit Nail Tech Modal -->
<div class="modal fade" id="techModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark" id="modalTitle">Add New Nail Technician</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body py-4">
                <form id="techForm">
                    <input type="hidden" id="techId">
                    <div class="mb-3">
                        <label for="techName" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="techName" required placeholder="e.g., Jessica Smith">
                    </div>
                    <div class="mb-3">
                        <label for="techEmail" class="form-label fw-semibold">Email / Username</label>
                        <input type="text" class="form-control" id="techEmail" required placeholder="jessica@jennysnailstudio.com">
                    </div>
                    <div class="mb-3">
                        <label for="techSpecialty" class="form-label fw-semibold">Specialty</label>
                        <input type="text" class="form-control" id="techSpecialty" placeholder="e.g., Gel Art, Acrylics">
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-pink btn-sm px-3" onclick="saveNailTech()">Save Technician</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Admin Management Panel</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Fallback-safe token lookup matching both token storage conventions
    const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
    let techModalInstance = null;

    if (!token) {
        window.location.href = './login.html';
    } else {
        document.addEventListener('DOMContentLoaded', () => {
            techModalInstance = new bootstrap.Modal(document.getElementById('techModal'));
            loadNailTechs();
        });
    }

    // Fetch nail techs from backend REST endpoint
    async function loadNailTechs() {
        try {
            const response = await fetch('/api/nail-techs', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!response.ok) throw new Error('Failed to fetch nail technicians');

            const techs = await response.json();
            const tbody = document.getElementById('techTableBody');
            tbody.innerHTML = '';

            if (techs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No nail technicians found.</td></tr>`;
                return;
            }

            techs.forEach(tech => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${tech.id}</td>
                        <td class="fw-semibold">${tech.name || tech.username}</td>
                        <td>${tech.email || tech.username}</td>
                        <td><span class="badge bg-light text-dark border">${tech.specialty || 'General'}</span></td>
                        <td class="text-end">
                            <button class="btn btn-outline-secondary btn-sm me-1" onclick="openEditModal(${tech.id}, '${tech.name || tech.username}', '${tech.email || tech.username}', '${tech.specialty || ''}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteNailTech(${tech.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Error loading nail techs:', error);
            document.getElementById('techTableBody').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error loading data from server.</td></tr>`;
        }
    }

    function openAddModal() {
        document.getElementById('techId').value = '';
        document.getElementById('techName').value = '';
        document.getElementById('techEmail').value = '';
        document.getElementById('techSpecialty').value = '';
        document.getElementById('modalTitle').innerText = 'Add New Nail Technician';
        techModalInstance.show();
    }

    function openEditModal(id, name, email, specialty) {
        document.getElementById('techId').value = id;
        document.getElementById('techName').value = name;
        document.getElementById('techEmail').value = email;
        document.getElementById('techSpecialty').value = specialty === 'undefined' ? '' : specialty;
        document.getElementById('modalTitle').innerText = 'Edit Nail Technician';
        techModalInstance.show();
    }

    async function saveNailTech() {
        const id = document.getElementById('techId').value;
        const name = document.getElementById('techName').value;
        const email = document.getElementById('techEmail').value;
        const specialty = document.getElementById('techSpecialty').value;

        if (!name || !email) {
            alert('Please fill in all required fields.');
            return;
        }

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/nail-techs/${id}` : '/api/nail-techs';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ name, email, specialty })
            });

            if (response.ok) {
                techModalInstance.hide();
                loadNailTechs();
            } else {
                const text = await response.text();
                let errorMsg = 'Unknown error';
                try {
                    const errObj = JSON.parse(text);
                    errorMsg = errObj.message || text;
                } catch (e) {
                    errorMsg = text || response.statusText;
                }
                alert('Failed to save: ' + errorMsg);
            }
        } catch (error) {
            console.error('Error saving nail tech:', error);
            alert('Server connection error.');
        }
    }

    async function deleteNailTech(id) {
        if (!confirm('Are you sure you want to delete this nail technician?')) return;

        try {
            const response = await fetch(`/api/nail-techs/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                loadNailTechs();
            } else {
                alert('Failed to delete nail technician.');
            }
        } catch (error) {
            console.error('Error deleting nail tech:', error);
            alert('Server connection error.');
        }
    }

    function handleLogout() {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('token');
        localStorage.removeItem('userRole');
        window.location.href = './index.html';
    }

    // --- ADMIN ROUTE GUARD ---
    (function() {
        const guardToken = localStorage.getItem('accessToken') || localStorage.getItem('token');
        let role = localStorage.getItem('userRole');

        if (!guardToken) {
            window.location.href = './login.html';
            return;
        }

        if (!role) {
            role = parseJwtRole(guardToken);
            if (role) {
                localStorage.setItem('userRole', role);
            }
        }

        if (role !== 'ROLE_ADMIN' && role !== 'ADMIN') {
            alert('Access Denied: Administrator privileges are required to view this page.');
            window.location.href = './index.html';
        }

        function parseJwtRole(jwtToken) {
            try {
                const base64Url = jwtToken.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const payload = JSON.parse(jsonPayload);
                return payload.role || payload.authorities || (payload.roles ? payload.roles[0] : null) || 'ROLE_USER';
            } catch (e) {
                console.error('Failed to parse JWT role:', e);
                return 'ROLE_USER';
            }
        }
    })();
    // --- END ADMIN GUARD ---
</script>
</body>
</html>
