<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Gallery & Catalog - Jenny's Nail Studio</title>
    <!-- Favicon Tag -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }

        /* Clickable User Badge Styling */
        .user-badge-link {
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .user-badge-link:hover {
            transform: translateY(-1px);
            background-color: #f8d7da !important;
            box-shadow: 0 2px 5px rgba(233, 30, 99, 0.15);
        }

        /* Card Hover & Image Effects */
        .product-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12) !important;
        }

        .product-image-container {
            height: 240px;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navigation Header -->
<header class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 px-lg-4">
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-3">
            <a href="/" class="navbar-brand fw-bold text-pink fs-4 mb-0">Jenny's Nail Studio</a>
            <!-- Clickable User Badge shown next to logo when logged in -->
            <a href="profile.html"
               id="userBadge"
               class="badge bg-danger-subtle text-pink border border-danger-subtle rounded-pill px-3 py-2 fs-6 d-none align-items-center gap-1 user-badge-link"
               title="Click to view and edit profile settings">
                <i class="bi bi-person-fill"></i>
                <span id="usernameDisplay">Client</span>
            </a>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 pt-3 pt-lg-0" id="authNav">
                <!-- Injected dynamically via JavaScript -->
            </div>
        </div>
    </div>
</header>

<!-- Main Content Container -->
<main class="container my-5 flex-grow-1">
    <div class="text-center mb-5">
        <h1 class="display-6 fw-bold text-dark mb-2">Nail Design Catalog</h1>
        <p class="lead text-muted mx-auto" style="max-width: 600px;">Explore our trending styles and custom press-on collections.</p>
    </div>

    <!-- Responsive Card Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 justify-content-center">

        <!-- Card 1 -->
        <div class="col d-flex">
            <div class="card h-100 border-0 shadow-sm rounded-4 product-card overflow-hidden w-100">
                <div class="product-image-container">
                    <img src="./nail_collection/nail1.png" alt="Classic Minimalist French" class="img-fluid">
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <span class="text-pink text-uppercase fw-bold fs-7 mb-1" style="letter-spacing: 0.5px;">Classic Series</span>
                    <h3 class="card-title h5 fw-bold text-dark mb-2">Classic Minimalist French</h3>
                    <div class="fs-5 fw-bold text-dark mb-4">$25.00</div>
                    <button class="btn btn-pink rounded-3 py-2 fw-bold w-100 mt-auto" onclick="selectProduct('Classic Minimalist French')">
                        Book Style
                    </button>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col d-flex">
            <div class="card h-100 border-0 shadow-sm rounded-4 product-card overflow-hidden w-100">
                <div class="product-image-container">
                    <img src="./nail_collection/nail2.png" alt="Pearl Glazed Chrome" class="img-fluid">
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <span class="text-pink text-uppercase fw-bold fs-7 mb-1" style="letter-spacing: 0.5px;">Trending</span>
                    <h3 class="card-title h5 fw-bold text-dark mb-2">Pearl Glazed Chrome</h3>
                    <div class="fs-5 fw-bold text-dark mb-4">$35.00</div>
                    <button class="btn btn-pink rounded-3 py-2 fw-bold w-100 mt-auto" onclick="selectProduct('Pearl Glazed Chrome')">
                        Book Style
                    </button>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col d-flex">
            <div class="card h-100 border-0 shadow-sm rounded-4 product-card overflow-hidden w-100">
                <div class="product-image-container">
                    <img src="./nail_collection/nail3.png" alt="Hand-Painted Floral Set" class="img-fluid">
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <span class="text-pink text-uppercase fw-bold fs-7 mb-1" style="letter-spacing: 0.5px;">Custom Art</span>
                    <h3 class="card-title h5 fw-bold text-dark mb-2">Hand-Painted Floral Set</h3>
                    <div class="fs-5 fw-bold text-dark mb-4">$45.00</div>
                    <button class="btn btn-pink rounded-3 py-2 fw-bold w-100 mt-auto" onclick="selectProduct('Hand-Painted Floral Set')">
                        Book Style
                    </button>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Custom Nail Sculpting & Artistry</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Utility to decode JWT token payload and check expiration
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            const payload = JSON.parse(jsonPayload);
            if (payload.exp && Date.now() >= payload.exp * 1000) {
                return null; // Expired token
            }
            return payload;
        } catch (e) {
            return null;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Fallback-safe token retrieval
        const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
        const username = localStorage.getItem('username');

        const authNav = document.getElementById('authNav');
        const userBadge = document.getElementById('userBadge');
        const usernameDisplay = document.getElementById('usernameDisplay');

        const decodedToken = token ? parseJwt(token) : null;

        if (token && decodedToken) {
            let activeUser = username;
            if (!activeUser) {
                activeUser = decodedToken.sub || decodedToken.username || 'Client';
            }

            // Extract role to determine admin privileges
            const role = decodedToken.role || decodedToken.authorities || (decodedToken.roles ? decodedToken.roles[0] : 'ROLE_USER');
            const isAdmin = role === 'ROLE_ADMIN' || role === 'ADMIN';

            // Display Username Badge
            if (userBadge && usernameDisplay) {
                usernameDisplay.textContent = activeUser;
                userBadge.classList.remove('d-none');
                userBadge.classList.add('d-inline-flex');
            }

            // Build Admin Link if applicable
            let adminLinkHtml = '';
            if (isAdmin) {
                adminLinkHtml = `<a href="./admin-dashboard.html" class="nav-link fw-bold text-danger"><i class="bi bi-shield-lock-fill me-1"></i>Admin Portal</a>`;
            }

            // Logged-in Navigation Links
            authNav.innerHTML = `
                <a href="./dashboard.html" class="nav-link fw-semibold text-dark">Showcase</a>
                <a href="./services.html" class="nav-link fw-semibold text-dark">Services</a>
                ${adminLinkHtml}
                <a href="./profile.html" class="nav-link fw-semibold text-dark">Profile</a>
                <a href="#" onclick="handleLogout()" class="nav-link fw-semibold text-dark">Logout</a>
                <a href="./subscription-plans.html" class="btn btn-pink rounded-pill px-4 py-2 fw-semibold">Subscription Plans</a>
            `;
        } else {
            if (token) {
                localStorage.removeItem('accessToken');
                localStorage.removeItem('token');
                localStorage.removeItem('username');
            }

            // Guest Navigation Links
            if (userBadge) {
                userBadge.classList.add('d-none');
                userBadge.classList.remove('d-inline-flex');
            }

            authNav.innerHTML = `
                <a href="./services.html" class="nav-link fw-semibold text-dark">Services</a>
                <a href="./login.html" class="nav-link fw-semibold text-dark">Log in</a>
                <a href="./signup.html" class="nav-link fw-semibold text-dark">Sign up</a>
                <a href="./subscription-plans.html" class="btn btn-pink rounded-pill px-4 py-2 fw-semibold">Subscription Plans</a>
            `;
        }
    });

    function selectProduct(productName) {
        localStorage.setItem('selectedDesign', productName);

        const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
        if (token) {
            // Logged in -> redirect directly to booking page
            window.location.href = './booking.html';
        } else {
            // Not logged in -> prompt login
            window.location.href = './login.html';
        }
    }

    function handleLogout() {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('userRole');
        window.location.reload();
    }
</script>
</body>
</html>
