<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Jenny's Nail Studio</title>
    <!-- Favicon Tag -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }

        /* Card Hover Effect */
        .login-card {
            transition: box-shadow 0.25s ease;
        }
        .login-card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12) !important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center p-3">

<div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 login-card w-100" style="max-width: 400px;">
    <div class="text-center mb-4">
        <a href="/" class="text-decoration-none">
            <h1 class="h4 fw-bold text-pink mb-1">Jenny's Nail Studio</h1>
        </a>
        <h2 class="h5 text-dark fw-semibold">Welcome Back</h2>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
            <label for="username" class="form-label text-muted small fw-semibold">Username</label>
            <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0">
                        <i class="bi bi-person"></i>
                    </span>
                <input type="text" id="username" class="form-control border-start-0 ps-0" required autocomplete="username" placeholder="Enter your username">
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label text-muted small fw-semibold">Password</label>
            <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0">
                        <i class="bi bi-lock"></i>
                    </span>
                <input type="password" id="password" class="form-control border-start-0 ps-0" required autocomplete="current-password" placeholder="Enter your password">
            </div>
        </div>

        <button type="submit" class="btn btn-pink w-100 py-2 rounded-3 fw-semibold mt-2">Log In</button>
    </form>

    <p id="errorMsg" class="text-danger small text-center mt-3 mb-0"></p>

    <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Don't have an account?</span>
        <a href="/signup.html" class="text-pink fw-semibold small text-decoration-none ms-1">Sign Up</a>
    </div>
</div>

<!-- Footer -->
<footer class="mt-4 text-center">
    <small class="text-muted">&copy; Jenny's Nail Studio — Client Access Portal</small>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.innerText = '';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            if (response.ok) {
                const data = await response.json();
                // Store token supporting both field names
                const token = data.accessToken || data.token;
                localStorage.setItem('accessToken', token);

                // Force navigation to protected dashboard
                window.location.assign('/index.html');
            } else {
                errorMsg.innerText = 'Invalid username or password.';
            }
        } catch (err) {
            console.error('Login process error:', err);
            errorMsg.innerText = 'Unable to connect to the server.';
        }
    }
</script>
</body>
</html>
