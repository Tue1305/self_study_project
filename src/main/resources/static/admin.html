<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jenny's Nail Studio</title>
    <!-- Favicon Tag -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?=v2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- FullCalendar 6 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }
        #calendar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Header Navigation -->
<header class="navbar navbar-expand bg-white shadow-sm px-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold text-dark fs-5">
            <i class="bi bi-shield-lock-fill text-pink me-2"></i>Admin Portal
        </span>
        <a href="/" class="navbar-brand fw-bold text-pink text-decoration-none">
            Jenny's Nail Studio
        </a>
        <button class="btn btn-outline-pink btn-sm fw-semibold ms-auto" onclick="handleLogout()">
            <i class="bi bi-box-arrow-right me-1"></i> Log Out
        </button>
    </div>
</header>

<!-- Main Container -->
<main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 fw-bold text-dark mb-0">
            <i class="bi bi-calendar-check-fill text-pink me-2"></i>Appointment Schedule
        </h2>
    </div>

    <!-- Calendar Card Container -->
    <div class="card border-0 shadow-sm rounded-3 p-3">
        <div id="calendar"></div>
    </div>
</main>

<!-- Appointment Details Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-dark">
                    <i class="bi bi-info-circle text-pink me-2"></i>Booking Details
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Populated dynamically -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success btn-sm" onclick="updateAppointmentStatus('CONFIRMED')">Confirm</button>
                <button type="button" class="btn btn-danger btn-sm" onclick="updateAppointmentStatus('CANCELLED')">Cancel</button>
                <button type="button" class="btn btn-secondary btn-sm ms-auto" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Admin Management Panel</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- FullCalendar 6 JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    let currentAppointmentId = null;
    const token = localStorage.getItem('accessToken');

    // Token verification check on page load
    if (!token) {
        window.location.href = './login.html';
    } else {
        document.addEventListener('DOMContentLoaded', initCalendar);
    }

    function initCalendar() {
        const calendarEl = document.getElementById('calendar');

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            // Fetch appointments from your Spring Boot backend
            events: function(fetchInfo, successCallback, failureCallback) {
                fetch('/api/appointments', {
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to fetch appointments');
                        return response.json();
                    })
                    .then(data => {
                        const events = data.map(apt => {
                            let badgeColor = '#ffc107'; // PENDING
                            if (apt.status === 'CONFIRMED') badgeColor = '#198754'; // GREEN
                            if (apt.status === 'CANCELLED') badgeColor = '#dc3545'; // RED

                            return {
                                id: apt.id,
                                title: `${apt.customerName} - ${apt.service ? apt.service.name : 'Service'}`,
                                start: apt.appointmentTime,
                                backgroundColor: badgeColor,
                                borderColor: badgeColor,
                                textColor: '#fff',
                                extendedProps: {
                                    phone: apt.customerPhone,
                                    email: apt.customerEmail,
                                    status: apt.status,
                                    serviceName: apt.service ? apt.service.name : 'N/A'
                                }
                            };
                        });
                        successCallback(events);
                    })
                    .catch(error => {
                        console.error('Error loading calendar events:', error);
                        failureCallback(error);
                    });
            },
            // Open modal showing booking info when admin clicks an appointment block
            eventClick: function(info) {
                currentAppointmentId = info.event.id;
                const props = info.event.extendedProps;
                const modalBody = document.getElementById('modalBody');
                const customerName = info.event.title.split(' - ')[0];

                modalBody.innerHTML = `
                    <p class="mb-2"><strong>Customer Name:</strong> ${customerName}</p>
                    <p class="mb-2"><strong>Phone Number:</strong> <a href="tel:${props.phone}" class="text-decoration-none">${props.phone}</a></p>
                    <p class="mb-2"><strong>Email:</strong> <a href="mailto:${props.email}" class="text-decoration-none">${props.email}</a></p>
                    <p class="mb-2"><strong>Service:</strong> ${props.serviceName}</p>
                    <p class="mb-2"><strong>Time:</strong> ${info.event.start.toLocaleString()}</p>
                    <p class="mb-0"><strong>Status:</strong> <span class="badge bg-secondary">${props.status}</span></p>
                `;

                const modal = new bootstrap.Modal(document.getElementById('appointmentModal'));
                modal.show();
            }
        });

        calendar.render();
    }

    async function updateAppointmentStatus(newStatus) {
        if (!currentAppointmentId) return;

        try {
            const response = await fetch(`/api/appointments/${currentAppointmentId}/status?status=${newStatus}`, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                location.reload();
            } else {
                alert('Failed to update appointment status.');
            }
        } catch (err) {
            console.error('Error updating status:', err);
            alert('Server connection error.');
        }
    }

    function handleLogout() {
        localStorage.removeItem('accessToken');
        window.location.href = './index.html';
    }
</script>
</body>
</html>
