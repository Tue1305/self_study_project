<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        input, button { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sign In</h2>
    <input type="text" id="username" placeholder="Username" value="user">
    <input type="password" id="password" placeholder="Password" value="password">
    <button onclick="login()">Sign In</button>
    <p id="errorMsg" style="color: red;"></p>
</div>

<script>
    // Redirect immediately if user is already logged in
    if (localStorage.getItem("accessToken")) {
        window.location.href = "/dashboard.html";
    }

    async function login() {
        const usernameInput = document.getElementById("username").value;
        const passwordInput = document.getElementById("password").value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem("accessToken", data.token);
                localStorage.setItem("currentUser", usernameInput);

                // REDIRECT TO DASHBOARD PAGE
                window.location.href = "/dashboard.html";
            } else {
                document.getElementById("errorMsg").innerText = "Invalid credentials!";
            }
        } catch (err) {
            console.error(err);
        }
    }
</script>
</body>
</html>
