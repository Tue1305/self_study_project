<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subscribers - Jenny's Nail Studio</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?=v2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bs-primary-pink: #e91e63; }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .btn-outline-pink { color: var(--bs-primary-pink); border-color: var(--bs-primary-pink); }
        .btn-outline-pink:hover { background-color: var(--bs-primary-pink); color: #fff; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; color: #fff !important; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Unified Header Navigation -->
<header class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold text-dark fs-5">
            <i class="bi bi-shield-lock-fill text-pink me-2"></i>Admin Portal
        </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-2">
                <li class="nav-item">
                    <a class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark" href="./admin-calendar.html">
                        <i class="bi bi-calendar-week me-1"></i> Customer Calendar
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark" href="./nail-techs.html">
                        <i class="bi bi-people me-1"></i> Nail Techs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-pink btn-sm px-3 fw-semibold" href="./subscribers.html">
                        <i class="bi bi-star me-1"></i> View Subscribers
                    </a>
                </li>
            </ul>
            <button class="btn btn-outline-pink btn-sm fw-semibold ms-auto" onclick="handleLogout()">
                <i class="bi bi-box-arrow-right me-1"></i> Log Out
            </button>
        </div>
    </div>
</header>

<!-- Main Container -->
<main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 fw-bold text-dark mb-0">
            <i class="bi bi-star-fill text-pink me-2"></i>Customer Subscribers
        </h2>
    </div>

    <!-- Subscribers Table Card -->
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Username / Email</th>
                    <th>Role</th>
                    <th>Subscription Plan</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="subscriberTableBody">
                <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Admin Management Panel</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = localStorage.getItem('accessToken');

    if (!token) {
        window.location.href = './login.html';
    } else {
        document.addEventListener('DOMContentLoaded', loadSubscribers);
    }

    async function loadSubscribers() {
        try {
            const response = await fetch('/api/subscriptions/admin/all', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!response.ok) throw new Error('Failed to fetch subscribers');

            const users = await response.json();
            const tbody = document.getElementById('subscriberTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No subscribers found.</td></tr>`;
                return;
            }

            users.forEach(user => {
                let badgeColor = user.subscriptionStatus === 'ACTIVE' ? 'bg-success' : 'bg-secondary';
                tbody.innerHTML += `
                    <tr>
                        <td>#${user.id}</td>
                        <td class="fw-semibold">${user.username}</td>
                        <td><span class="badge bg-light text-dark border">${user.role || 'ROLE_USER'}</span></td>
                        <td>${user.subscriptionPlan || 'None'}</td>
                        <td><span class="badge ${badgeColor}">${user.subscriptionStatus || 'INACTIVE'}</span></td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Error loading subscribers:', error);
            document.getElementById('subscriberTableBody').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error loading data from server.</td></tr>`;
        }
    }

    function handleLogout() {
        localStorage.removeItem('accessToken');
        window.location.href = './index.html';
    }

    // --- ADMIN ROUTE GUARD ---
    (function() {
        const token = localStorage.getItem('accessToken');
        let role = localStorage.getItem('userRole');

        // 1. Check if token exists
        if (!token) {
            window.location.href = './login.html';
            return;
        }

        // 2. If role isn't stored in localStorage, try parsing it from the JWT token
        if (!role) {
            role = parseJwtRole(token);
            if (role) {
                localStorage.setItem('userRole', role);
            }
        }

        // 3. Enforce Admin Role
        if (role !== 'ROLE_ADMIN' && role !== 'ADMIN') {
            alert('Access Denied: Administrator privileges are required to view this page.');
            window.location.href = './index.html';
        }

        // JWT Role Parser Helper
        function parseJwtRole(jwtToken) {
            try {
                const base64Url = jwtToken.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const payload = JSON.parse(jsonPayload);
                return payload.role || (payload.roles ? payload.roles[0] : null) || 'ROLE_USER';
            } catch (e) {
                console.error('Failed to parse JWT role:', e);
                return 'ROLE_USER';
            }
        }
    })();
    // --- END ADMIN GUARD ---
</script>
</body>
</html>
