<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Jenny's Nail Studio</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary-pink: #e91e63;
            --bs-primary-pink-hover: #d81b60;
        }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .bg-pink { background-color: var(--bs-primary-pink) !important; }
        .btn-pink {
            background-color: var(--bs-primary-pink);
            color: #fff;
            border: none;
        }
        .btn-pink:hover {
            background-color: var(--bs-primary-pink-hover);
            color: #fff;
        }
        .btn-outline-pink {
            color: var(--bs-primary-pink);
            border-color: var(--bs-primary-pink);
        }
        .btn-outline-pink:hover {
            background-color: var(--bs-primary-pink);
            color: #fff;
        }

        /* Clickable User Badge Styling */
        .user-badge-link {
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .user-badge-link:hover {
            transform: translateY(-1px);
            background-color: #f8d7da !important; /* Slightly darker shade on hover */
            box-shadow: 0 2px 5px rgba(233, 30, 99, 0.15);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navigation Header -->
<header class="navbar navbar-expand-lg bg-white shadow-sm sticky-top px-3 px-lg-4">
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-3">
            <a href="/" class="navbar-brand fw-bold text-pink fs-4 mb-0">Jenny's Nail Studio</a>

            <!-- Clickable User Badge (Hidden by default when logged out) -->
            <a href="/profile.html"
               id="userBadge"
               class="badge bg-danger-subtle text-pink border border-danger-subtle rounded-pill px-3 py-2 fs-6 d-none align-items-center gap-1 user-badge-link"
               title="Click to view and edit profile settings">
                <i class="bi bi-person-fill"></i>
                <span id="usernameDisplay">Client</span>
            </a>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 pt-3 pt-lg-0" id="authNav">
                <!-- Dynamically filled based on login status -->
            </div>
        </div>
    </div>
</header>

<!-- Main Content Container -->
<main class="container my-5 flex-grow-1">
    <div class="text-center mb-5">
        <h1 class="display-6 fw-bold text-dark mb-2">Our Nail Services</h1>
        <p class="lead text-muted mx-auto" style="max-width: 650px;">Choose from our signature manicures, custom gel extensions, and creative nail artistry.</p>
    </div>

    <!-- Services Grid Placeholder -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col">
            <div class="card h-100 border-0 shadow-sm rounded-4 p-4">
                <h3 class="h5 fw-bold text-dark">Gel Manicure</h3>
                <p class="text-muted small">Long-lasting gel polish with cuticle care and nail shaping.</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                    <span class="fw-bold fs-5 text-pink">$45</span>
                    <a href="/subscription-plans.html" class="btn btn-sm btn-pink rounded-pill px-3">Book Service</a>
                </div>
            </div>
        </div>
        <!-- Add additional service cards as needed -->
    </div>
</main>

<!-- Footer -->
<footer class="bg-white border-top text-center py-3 mt-auto">
    <div class="container">
        <small class="text-muted">&copy; Jenny's Nail Studio — Custom Nail Sculpting &amp; Artistry</small>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = localStorage.getItem('accessToken');
    const storedUsername = localStorage.getItem('username');

    document.addEventListener('DOMContentLoaded', () => {
        const authNav = document.getElementById('authNav');
        const userBadge = document.getElementById('userBadge');
        const usernameDisplay = document.getElementById('usernameDisplay');

        if (token) {
            // 1. Show user badge and display the username
            if (userBadge && usernameDisplay) {
                usernameDisplay.textContent = storedUsername || 'Client';
                userBadge.classList.remove('d-none');
                userBadge.classList.add('d-inline-flex');
            }

            // 2. Render Logged-In Navigation Links
            authNav.innerHTML = `
                    <a href="/dashboard.html" class="nav-link fw-semibold text-dark">Showcase</a>
                    <a href="/services.html" class="nav-link fw-semibold text-pink active">Services</a>
                    <a href="/subscription-plans.html" class="nav-link fw-semibold text-dark">Subscriptions</a>
                    <a href="#" onclick="handleLogout()" class="btn btn-outline-pink rounded-pill px-3 py-1 btn-sm ms-lg-2">Logout</a>
                `;
        } else {
            // 1. Ensure user badge remains hidden for guests
            if (userBadge) {
                userBadge.classList.add('d-none');
                userBadge.classList.remove('d-inline-flex');
            }

            // 2. Render Guest Navigation Links
            authNav.innerHTML = `
                    <a href="/services.html" class="nav-link fw-semibold text-pink active">Services</a>
                    <a href="/subscription-plans.html" class="nav-link fw-semibold text-dark">Subscriptions</a>
                    <a href="/login.html" class="nav-link fw-semibold text-dark">Log In</a>
                    <a href="/signup.html" class="btn btn-pink rounded-pill px-3 py-1 btn-sm ms-lg-2">Sign Up</a>
                `;
        }
    });

    function handleLogout() {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('username');
        window.location.reload();
    }
</script>
</body>
</html>
