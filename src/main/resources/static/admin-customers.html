<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Manage Customers - Jenny's Nail Studio</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?=v2">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bs-primary-pink: #e91e63; }
        .text-pink { color: var(--bs-primary-pink) !important; }
        .btn-outline-pink { color: var(--bs-primary-pink); border-color: var(--bs-primary-pink); }
        .btn-outline-pink:hover { background-color: var(--bs-primary-pink); color: #fff; }
        .btn-pink { background-color: var(--bs-primary-pink); border-color: var(--bs-primary-pink); color: #fff; }
        .btn-pink:hover { filter: brightness(0.9); color: #fff; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Unified Header Navigation -->
<header class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold text-dark fs-5 d-flex align-items-center gap-2">
            <i class="bi bi-shield-lock-fill text-pink"></i>
            <span id="portalBrandTitle">Jenny's Admin Portal</span>
            <span id="tenantPill" class="badge bg-secondary ms-1">DEFAULT</span>
        </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                <li class="nav-item">
                    <a id="navDashboardLink" class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark me-1" href="./admin-dashboard.html">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a id="navCalendarLink" class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark me-1" href="./admin-calendar.html">
                        <i class="bi bi-calendar-week me-1"></i> Calendar
                    </a>
                </li>
                <li class="nav-item">
                    <a id="navTechsLink" class="nav-link btn btn-light btn-sm px-3 fw-semibold text-dark me-1" href="./nail-techs.html">
                        <i class="bi bi-people me-1"></i> Nail Techs
                    </a>
                </li>
                <li class="nav-item">
                    <a id="navCustomersLink" class="nav-link btn btn-light btn-sm px-3 fw-semibold text-pink me-1" href="./admin-customers.html">
                        <i class="bi bi-person-lines-fill me-1"></i> Customers
                    </a>
                </li>
                <li class="nav-item">
                    <a id="navWebsiteLink" class="nav-link btn btn-outline-secondary btn-sm px-3 fw-semibold text-dark" href="./index.html">
                        <i class="bi bi-globe me-1"></i> Main Website
                    </a>
                </li>
            </ul>
            <button class="btn btn-outline-pink btn-sm fw-semibold ms-auto" onclick="handleLogout()">
                <i class="bi bi-box-arrow-right me-1"></i> Log Out
            </button>
        </div>
    </div>
</header>

<!-- Main Container -->
<main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 fw-bold text-dark mb-0">
            <i class="bi bi-person-lines-fill text-pink me-2"></i><span id="customerHeading">Customer Database</span>
        </h2>
        <button class="btn btn-pink btn-sm fw-semibold" onclick="openAddModal()">
            <i class="bi bi-plus-lg me-1"></i> Add Customer
        </button>
    </div>

    <!-- Customers Table Card -->
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="customerTableBody">
                <!-- Populated dynamically via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Add/Edit Customer Modal -->
<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark" id="modalTitle">Add New Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-4">
                <input type="hidden" id="customerId">
                <div class="mb-3">
                    <label for="customerName" class="form-label fw-semibold text-secondary small">Full Name</label>
                    <input type="text" class="form-control rounded-3" id="customerName" placeholder="e.g. John Doe" required>
                </div>
                <div class="mb-3">
                    <label for="customerEmail" class="form-label fw-semibold text-secondary small">Email</label>
                    <input type="email" class="form-control rounded-3" id="customerEmail" placeholder="e.g. john@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="customerPhone" class="form-label fw-semibold text-secondary small">Phone Number</label>
                    <input type="tel" class="form-control rounded-3" id="customerPhone" placeholder="e.g. (555) 123-4567">
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light rounded-3 px-4 fw-semibold" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-pink rounded-3 px-4 fw-semibold" onclick="saveCustomer()">Save Customer</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer with Store Hours -->
<footer class="bg-white border-top py-4 mt-auto">
    <div class="container text-center">
        <div class="d-inline-flex align-items-center gap-2 px-3 py-1 bg-light border rounded-pill mb-2">
            <i class="bi bi-clock-fill text-pink"></i>
            <span class="small fw-semibold text-dark">Store Hours: Monday – Saturday: 10:00 AM – 7:00 PM | Sunday: Closed</span>
        </div>
        <div>
            <small id="footerCopyright" class="text-muted">&copy; Jenny's Nail Studio — Customer Database Management</small>
        </div>
    </div>
</footer>

<!-- Bootstrap 5.3 JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = localStorage.getItem('accessToken') || localStorage.getItem('token');
    let customerModalInstance = null;

    // --- ADMIN ROUTE GUARD ---
    (function() {
        if (!token) {
            window.location.href = './login.html';
            return;
        }

        const role = parseJwtRole(token);
        localStorage.setItem('userRole', role);

        if (role !== 'ROLE_ADMIN' && role !== 'ADMIN') {
            alert('Access Denied: Administrator privileges are required to view this page.');
            window.location.href = './index.html';
        }

        function parseJwtRole(jwtToken) {
            try {
                const base64Url = jwtToken.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const payload = JSON.parse(jsonPayload);
                return payload.role || payload.authorities || (payload.roles ? payload.roles[0] : null) || 'ROLE_USER';
            } catch (e) {
                console.error('Failed to parse JWT role:', e);
                return 'ROLE_USER';
            }
        }
    })();
    // --- END ADMIN GUARD ---

    function getActiveTenant() {
        const urlParams = new URLSearchParams(window.location.search);
        const queryTenant = urlParams.get('tenant');
        if (queryTenant) return queryTenant.toLowerCase();

        const host = window.location.hostname.toLowerCase();
        if (host.startsWith('luxe.')) return 'luxe';

        const storedTenant = localStorage.getItem('tenant');
        if (storedTenant) return storedTenant.toLowerCase();

        return 'default';
    }

    const activeTenant = getActiveTenant();
    localStorage.setItem('tenant', activeTenant);

    // Apply links
    const tenantQuery = `?tenant=${encodeURIComponent(activeTenant)}`;
    document.getElementById('navDashboardLink').href = `./admin-dashboard.html${tenantQuery}`;
    document.getElementById('navCalendarLink').href = `./admin-calendar.html${tenantQuery}`;
    document.getElementById('navTechsLink').href = `./nail-techs.html${tenantQuery}`;
    document.getElementById('navWebsiteLink').href = activeTenant === 'luxe' ? `./booking.html${tenantQuery}` : `./index.html${tenantQuery}`;

    // Apply dynamic branding
    async function loadBranding() {
        try {
            const resp = await fetch(`/api/public/tenant-config?tenant=${encodeURIComponent(activeTenant)}`);
            if (resp.ok) {
                const cfg = await resp.json();
                const name = cfg.salonName || (activeTenant === 'luxe' ? 'Luxe Nail & Spa Sanctuary' : "Jenny's Nail Studio");
                const primaryColor = cfg.primaryColor || (activeTenant === 'luxe' ? '#00b4d8' : '#e91e63');

                document.documentElement.style.setProperty('--bs-primary-pink', primaryColor);
                document.getElementById('pageTitle').innerText = `Manage Customers - ${name}`;
                document.getElementById('portalBrandTitle').innerText = `${name} Portal`;
                document.getElementById('footerCopyright').innerHTML = `&copy; ${name} — Customer Database Management`;

                const pill = document.getElementById('tenantPill');
                if (pill) {
                    pill.innerText = activeTenant.toUpperCase();
                    pill.style.backgroundColor = primaryColor;
                    pill.classList.remove('bg-secondary');
                }
            } else if (activeTenant === 'luxe') {
                applyLuxeBrandingFallback();
            }
        } catch (e) {
            if (activeTenant === 'luxe') applyLuxeBrandingFallback();
        }
    }

    function applyLuxeBrandingFallback() {
        document.documentElement.style.setProperty('--bs-primary-pink', '#00b4d8');
        document.getElementById('pageTitle').innerText = "Manage Customers - Luxe Nail & Spa Sanctuary";
        document.getElementById('portalBrandTitle').innerText = "Luxe Nail & Spa Portal";
        document.getElementById('footerCopyright').innerHTML = "&copy; Luxe Nail & Spa Sanctuary — Customer Database Management";
        const pill = document.getElementById('tenantPill');
        if (pill) {
            pill.innerText = "LUXE";
            pill.style.backgroundColor = '#00b4d8';
            pill.classList.remove('bg-secondary');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        customerModalInstance = new bootstrap.Modal(document.getElementById('customerModal'));
        loadBranding();
        loadCustomers();
    });

    async function loadCustomers() {
        try {
            const response = await fetch('/api/customers', {
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-Tenant-ID': activeTenant
                }
            });
            if (!response.ok) throw new Error('Failed to fetch customers');

            const customers = await response.json();
            const tbody = document.getElementById('customerTableBody');
            tbody.innerHTML = '';

            if (customers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No customers found in the database.</td></tr>`;
                return;
            }

            customers.forEach((customer, index) => {
                const safeName = (customer.name || '').replace(/'/g, "\\'");
                const safeEmail = (customer.email || '').replace(/'/g, "\\'");
                const safePhone = (customer.phone || '').replace(/'/g, "\\'");

                tbody.innerHTML += `
                    <tr>
                        <td>#${index + 1}</td>
                        <td class="fw-semibold">${customer.name || 'N/A'}</td>
                        <td><a href="mailto:${customer.email || ''}" class="text-decoration-none">${customer.email || 'N/A'}</a></td>
                        <td><a href="tel:${customer.phone || ''}" class="text-decoration-none">${customer.phone || 'N/A'}</a></td>
                        <td class="text-end">
                            <button class="btn btn-outline-secondary btn-sm me-1" onclick="openEditModal(${customer.id}, '${safeName}', '${safeEmail}', '${safePhone}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteCustomer(${customer.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Error loading customers:', error);
            document.getElementById('customerTableBody').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Error loading customer data from server.</td></tr>`;
        }
    }

    function openAddModal() {
        document.getElementById('customerId').value = '';
        document.getElementById('customerName').value = '';
        document.getElementById('customerEmail').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('modalTitle').innerText = 'Add New Customer';
        customerModalInstance.show();
    }

    function openEditModal(id, name, email, phone) {
        document.getElementById('customerId').value = id;
        document.getElementById('customerName').value = name;
        document.getElementById('customerEmail').value = email;
        document.getElementById('customerPhone').value = phone === 'undefined' ? '' : phone;
        document.getElementById('modalTitle').innerText = 'Edit Customer';
        customerModalInstance.show();
    }

    async function saveCustomer() {
        const id = document.getElementById('customerId').value;
        const name = document.getElementById('customerName').value.trim();
        const email = document.getElementById('customerEmail').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();

        if (!name || !email) {
            alert('Please fill in Full Name and Email.');
            return;
        }

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/customers/${id}` : '/api/customers';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                    'X-Tenant-ID': activeTenant
                },
                body: JSON.stringify({ name, email, phone })
            });

            if (response.ok) {
                if (document.activeElement) {
                    document.activeElement.blur();
                }
                customerModalInstance.hide();
                loadCustomers();
            } else {
                const text = await response.text();
                let errorMsg = 'Unknown error';
                try {
                    const errObj = JSON.parse(text);
                    errorMsg = errObj.message || text;
                } catch (e) {
                    errorMsg = text || response.statusText;
                }
                alert('Failed to save customer: ' + errorMsg);
            }
        } catch (error) {
            console.error('Error saving customer:', error);
            alert('Server connection error.');
        }
    }

    async function deleteCustomer(id) {
        if (!confirm('Are you sure you want to delete this customer?')) return;

        try {
            const response = await fetch(`/api/customers/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'X-Tenant-ID': activeTenant
                }
            });

            if (response.ok) {
                loadCustomers();
            } else {
                alert('Failed to delete customer.');
            }
        } catch (error) {
            console.error('Error deleting customer:', error);
            alert('Server connection error.');
        }
    }

    function handleLogout() {
        const tenant = getActiveTenant();
        localStorage.removeItem('accessToken');
        localStorage.removeItem('token');
        localStorage.removeItem('userRole');
        localStorage.removeItem('tenant');
        window.location.href = tenant === 'luxe' ? './login.html?tenant=luxe' : './index.html';
    }
</script>
</body>
</html>
