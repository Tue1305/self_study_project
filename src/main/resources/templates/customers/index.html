<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Customer List</h2>
    <a th:href="@{/customers/new}" class="btn btn-primary">Add Customer</a>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.id}">1</td>
        <td th:text="${customer.name}">John Doe</td>
        <td th:text="${customer.email}">john@example.com</td>
        <td th:text="${customer.phone}">1234567890</td>
        <td>
            <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-warning btn-sm">Edit</a>
            <a th:href="@{/customers/delete/{id}(id=${customer.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Are you sure you want to delete this customer?')">Delete</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(customers)}">
        <td colspan="5" class="text-center">No customers found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
